# OkeyDocu - okeydocu/data/kinds.yaml
# The kinds of structure elements a new database starts with. All of it can be changed
# under Settings → Structure kinds.
#
# izytron:  object type code in an IZYTRON.IQ database, for the import
# interval: months until the next inspection is due, 0 for none
# features: "Label|unit", or {key, label, unit, list} where a feature needs its own key or
#           a list of its own (null for none); features left empty are not shown anywhere
# lists:    the choice list (data/choice_lists.yaml) offered by every feature of that label;
#           any other value may still be typed
#
# Producer: thorsten.schnebeck@gmx.net
# Generator: Claude Opus 5.5
# SPDX-FileCopyrightText: (C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>
# SPDX-License-Identifier: GPL-3.0-or-later

kinds:
  - {key: installation, label: Installation, icon: installation, interval: 48,
     features: [Operator, Person responsible, Installer, Year of installation, Network operator,
                Earthing system type, "Supply voltage|V", "Supply frequency|Hz", "Rated current|A",
                Cable type, "Cross-section|mm²", "Cable length|m"]}
  - {key: machine, label: Machine, icon: machine, izytron: 231, interval: 12,
     features: [CE marking, IP rating, Protection class, "Nominal voltage|V", Earthing system type,
                Supply cable, "Rated current|A", "Rated power|kW", Number of cores, Power factor,
                Characteristic, "Cross-section|mm²", Ex number, Ex zone,
                Type of ignition protection, "Cable length|m"]}
  - {key: device, label: Device, icon: device, interval: 12,
     features: [Protection class, "Nominal voltage|V", "Rated current|A", "Rated power|kW"]}
  - {key: distribution_board, label: Distribution board, icon: distribution_board,
     izytron: 232, interval: 48,
     features: [Board type, IP rating, Material, Installation method, Protection class,
                Earthing system type, "Cable length|m"]}
  - {key: field, label: Field (+EXT), icon: element}
  - {key: construction_distributor, label: Construction site distribution board,
     icon: construction_distributor, interval: 3,
     features: [Material number, Insulation class, Year of manufacture, Phases, Number of poles,
                "Rated current|A", "Rated voltage|V", "Rated power|kW", "Weight|kg"]}
  - {key: rcd, label: RCD, icon: rcd, izytron: 233, interval: 6,
     features: [RCD type, {key: number_of_poles, label: Poles of the protective device},
                N terminal, "Rated residual current|mA", "Rated current|A",
                {key: characteristic, label: Characteristic, list: rcd_characteristic},
                Circuit breaker characteristic, Cable type,
                {key: number_of_cores, label: Cores of the cable},
                "Cross-section|mm²", "Cable length|m"]}
  - {key: rcm, label: Residual current monitor, icon: rcm, interval: 6,
     features: [RCM type, Number of poles, "Rated residual current|mA", "Rated current|A",
                {key: characteristic, label: Characteristic, list: null}, "Alarm threshold|mA"]}
  - {key: imd, label: Insulation monitoring device, icon: imd, interval: 6,
     features: [IMD type, "Nominal system voltage|V", "Measuring voltage|V",
                "Measuring current|mA", "Warning value|kΩ", "Alarm value|kΩ"]}
  - {key: circuit, label: Circuit, icon: circuit, izytron: 236,
     features: [Cable type, Characteristic, {key: number_of_cores, label: Cores of the cable},
                "Rated current|A", "Cross-section|mm²",
                {key: number_of_poles, label: Poles of the protective device}, "Cable length|m"]}
  - {key: cable, label: Cable, icon: cable,
     features: [Cable type, Number of cores, "Cross-section|mm²", "Cable length|m"]}
  - {key: pa_conductor, label: Equipotential bonding conductor, icon: pa_conductor,
     interval: 48,
     features: [Cable type, Conductor material, "Cross-section|mm²", "Cable length|m"]}
  - {key: ground, label: Earthing system, icon: ground, interval: 48,
     features: [Earth electrode type, Material, Composition, Soil condition, Purpose,
                "Cross-section|mm²", "Cable length|m"]}
  - {key: equipment, label: Equipment, icon: equipment, izytron: 237,
     interval: 12,
     features: [Equipment type, Cable type, Degree of protection, Number of cores,
                Protection class, "Cross-section|mm²", "Cable length|m"]}
  - {key: electric_engine, label: Electric motor, icon: electric_engine,
     interval: 12,
     features: [IP rating, Insulation class, Year of manufacture, Gearbox, Number of poles, Phases,
                "Rated voltage|V", "Rated current|A", "Rated power|kW", Duty type, "Speed|1/min",
                Power factor]}
  - {key: generator, label: Generator, icon: generator, interval: 12,
     features: [IP rating, Thermal class, Insulation class, Phases, Year of manufacture,
                "Rated voltage|V", "Rated current|A", "Active power|kW", "Apparent power|kVA",
                Duty type, "Speed|1/min"]}
  - {key: wind_power, label: Wind turbine, icon: wind_power, interval: 12,
     features: [IP rating, Thermal class, Phases, Year of manufacture, "Rated voltage|V",
                "Rated current|A", "Active power|kW", "Apparent power|kVA", "Speed|1/min"]}
  - {key: photovoltaic, label: PV system, icon: photovoltaic, interval: 48,
     features: [Module type, "Rated power|kWp", "Nominal voltage|V", "Rated current|A",
                "Open-circuit voltage|V", "Short-circuit current|A", Connector, Cells per module]}
  - {key: charging_station, label: Charging station, icon: charging_station,
     interval: 12,
     features: [Charging equipment, "Total power|kW", Charging mode, Charging type,
                "Charging current|A", "DC charging voltage|V", Plug type,
                Three-phase charging points, Single-phase charging points]}
  - {key: battery, label: Battery, icon: battery, interval: 12,
     features: [Technology, Protection class, "Nominal voltage|V", Number of cells,
                "Cell voltage|V", "Rated capacity|Ah", "Final discharge voltage|V", IP rating]}
  - {key: battery_bank, label: Battery system, icon: battery_bank,
     interval: 12,
     features: [Battery type, Number of blocks, "Block voltage|V", "Total voltage|V",
                "Rated capacity|Ah", "Charging voltage|V", "Float charge voltage|V", Commissioning,
                IP rating]}
  - {key: vehicle, label: Vehicle, icon: vehicle, interval: 12,
     features: [Vehicle identification number, First registration, "Unladen weight|kg",
                "Gross weight|kg", "On-board voltage|V", "HV battery voltage|V",
                "HV battery capacity|kWh"]}
  - {key: floor_conveyor, label: Industrial truck, icon: floor_conveyor, interval: 12,
     features: [CE marking, Article number, Seats, "Weight|kg", "Payload|kg", "Maximum load|kg",
                Tyres]}
  - {key: extinguisher, label: Fire extinguisher, icon: extinguisher, interval: 24,
     features: [Extinguishing agent, Fire class, Filling quantity, Design, Propellant,
                Extinguishing rating, "Gross weight|kg"]}
  - {key: ladder, label: Ladder, icon: ladder, interval: 12,
     features: [Ladder type, Material, "Length|m", Number of rungs, "Maximum load|kg", Purchased,
                Withdrawn]}
  - {key: scaffolding, label: Scaffolding, icon: scaffolding,
     features: [Scaffold type, Design, Width class, Load class]}
  - {key: sling, label: Lifting accessory, icon: sling, interval: 12,
     features: [Material, "Working load limit|kg", "Proof load|kg", "Dead weight|kg", "Length|m"]}
  - {key: ppe, label: Protective equipment, icon: ppe, interval: 12,
     features: [Standard, Marking, Material, Protection class]}
  - {key: building_access, label: Door or gate, icon: building_access, interval: 12,
     features: [Opening type, Opening direction, Material, Load class, "Width|m", "Height|m"]}
  - {key: esd, label: ESD workstation, icon: esd, interval: 12,
     features: [Test object, Measurement type, Measuring points]}
  - {key: measuring_point, label: Measuring point, icon: measuring_point,
     izytron: 242}

lists:
  Cable type: cable_type
  Supply cable: cable_type
  Characteristic: characteristic
  Circuit breaker characteristic: breaker_characteristic
  Cross-section: cross_section
  Rated current: rated_current
  Rated residual current: rated_residual_current
  RCD type: rcd_type
  N terminal: n_terminal
  Poles of the protective device: number_of_poles
  Cores of the cable: cores
  Number of poles: number_of_poles
  Number of cores: cores
  Phases: phases
  Earthing system type: earthing_system
  IP rating: ip_rating
  Degree of protection: ip_rating
  Protection class: protection_class
  Conductor material: conductor_material
  Supply frequency: supply_frequency
  Ex zone: ex_zone
  Type of ignition protection: ignition_protection
