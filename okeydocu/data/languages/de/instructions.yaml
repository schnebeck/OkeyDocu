  Documentation: Dokumentation
  Are diagrams, warning notices and the other required information available?: Liegen Schaltpläne, Warnhinweise und die übrigen nötigen Angaben zur Anlage vor?
  Circuit labelling: Kennzeichnung der Stromkreise
  Are circuits, protective devices, switches and terminals clearly labelled?: Sind Stromkreise, Schutzeinrichtungen, Schalter und Klemmen eindeutig beschriftet?
  N and PE identification: Kennzeichnung N und PE
  Are neutral and protective conductors correctly identified throughout?: Sind Neutral- und Schutzleiter richtig und durchgehend gekennzeichnet?
  Equipment conformity: Normgerechte Betriebsmittel
  "Does the fixed equipment comply with its product standards (marking, certification, maker's data)?": "Entsprechen die fest installierten Betriebsmittel ihren Produktnormen (Aufschrift, Prüfzeichen, Herstellerangaben)?"
  No visible damage: Keine Schäden
  Is the equipment free of visible damage that impairs safety?: Sind die Betriebsmittel frei von sichtbaren Schäden, die die Sicherheit mindern?
  Protection against electric shock: Schutz gegen elektrischen Schlag
  Is the intended protective measure, basic and fault protection, fully implemented?: Ist die vorgesehene Schutzmaßnahme, Basis- und Fehlerschutz, vollständig umgesetzt?
  Exposed parts earthed: Körper geerdet
  Are all exposed-conductive-parts connected to the earthing arrangement?: Sind alle Körper an die Erdungsanlage angeschlossen?
  Earthing and bonding: Erdung und Potentialausgleich
  Are earthing, protective conductors and protective bonding suitably chosen and connected to the main earthing terminal?: Sind Erdungsanlage, Schutzleiter und Schutzpotentialausgleich passend ausgewählt und an der Haupterdungsschiene angeschlossen?
  Conductor sizing: Leiterquerschnitt
  Do cables, lines and busbars suit the current-carrying capacity and the voltage drop?: Passen Kabel, Leitungen und Stromschienen zu Strombelastbarkeit und Spannungsfall?
  Protective devices: Schutzeinrichtungen
  Are protective and monitoring devices correctly chosen, set and coordinated?: Sind Schutz- und Überwachungseinrichtungen richtig ausgewählt, eingestellt und aufeinander abgestimmt?
  Surge protection: Überspannungsschutz
  Are the required surge protective devices suitably selected, located and installed?: Sind die geforderten Überspannungs-Schutzeinrichtungen passend ausgewählt, platziert und eingebaut?
  Isolation and switching: Trennen und Schalten
  Are suitable isolating and switching devices present and correctly placed?: Sind geeignete Trenn- und Schaltgeräte vorhanden und richtig angeordnet?
  Single-pole devices: Einpolige Schalt- und Schutzeinrichtungen
  Are single-pole switching and protective devices in line conductors only?: Liegen einpolige Schalt- und Schutzeinrichtungen nur im Außenleiter?
  External influences: Äußere Einflüsse
  Are equipment and measures suitable for the surroundings and the mechanical stress, such as by their IP rating?: Sind Betriebsmittel und Schutzmaßnahmen für Umgebung und mechanische Beanspruchung geeignet, etwa nach ihrer IP-Schutzart?
  Fire barriers: Brandschutz
  Are fire barriers in place, and is there protection against thermal effects?: Sind Brandabschottungen vorhanden, und ist gegen thermische Auswirkungen geschützt?
  Connections: Leiterverbindungen
  Are all cable and conductor terminations properly made and secure?: Sind alle Kabel- und Leiteranschlüsse fachgerecht ausgeführt und fest?
  Wiring systems: Leitungsverlegung
  Are wiring systems suitably selected, routed and fixed?: Sind Kabel- und Leitungsanlagen passend ausgewählt, verlegt und befestigt?
  Accessibility: Zugänglichkeit
  Is the equipment easy to reach for operation, identification and maintenance?: Sind die Betriebsmittel für Bedienung, Kennzeichnung und Wartung gut erreichbar?
  EMC measures: EMV-Maßnahmen
  Are the planned measures against electromagnetic disturbances implemented?: Sind die vorgesehenen Maßnahmen gegen elektromagnetische Störungen umgesetzt?
  Special locations: Besondere Räume und Anlagen
  Are the additional requirements for special installations and locations (part 7) met?: Sind die Zusatzanforderungen für Betriebsstätten, Räume und Anlagen besonderer Art (Gruppe 700) erfüllt?
  "Machine – inspection to EN 60204-1": "Maschine – Besichtigung nach EN 60204-1"
  "Ask for the documentation of the machine. With several documents look for a list of them or a cover sheet, and compare type and serial number with the marking on the enclosure.": "Die Dokumentation der Maschine geben lassen. Bei mehreren Dokumenten nach einer Liste oder einem Deckblatt suchen und Typ und Seriennummer mit der Kennzeichnung am Gehäuse vergleichen."
  "Documentation: overview and identification": "Dokumentation: Übersicht und Identifizierung"
  "With more than one document: is there a main document that lists all documents of the electrical equipment, and does the documentation identify the equipment as its marking does?": "Bei mehr als einem Dokument: Gibt es ein Hauptdokument, das alle Dokumente der elektrischen Ausrüstung auflistet, und identifiziert die Dokumentation die Ausrüstung so wie deren Kennzeichnung?"
  "EN 60204-1, 17.2 a), b)": "EN 60204-1, 17.2 a), b)"
  "Look in the installation instructions and on the first sheets of the circuit diagram. Compare voltage, frequency and full-load current with the marking on the enclosure and with the supply on site.": "In der Installationsanleitung und auf den ersten Blättern des Stromlaufplans nachsehen. Spannung, Frequenz und Volllaststrom mit der Kennzeichnung am Gehäuse und mit dem Netz vor Ort vergleichen."
  "Documentation: connection to the supply": "Dokumentation: Anschluss an die Stromversorgung"
  "Does it describe installation and connection, and state for every supply connection the rated short-circuit current, nominal voltage, number of line conductors, frequency, type of system (TT, TN, IT) and full-load current, with further demands on the supply such as its highest impedance or the leakage current?": "Beschreibt sie Errichtung und Anschluss und nennt sie für jeden Netzanschluss Bemessungskurzschlussstrom, Nennspannung, Anzahl der Außenleiter, Frequenz, Art des Systems (TT, TN, IT) und Volllaststrom, dazu weitere Anforderungen an die Stromversorgung wie höchste Impedanz oder Ableitstrom?"
  "EN 60204-1, 17.2 c)": "EN 60204-1, 17.2 c)"
  "Look in the installation instructions for the conditions of the place. What this machine does not need is left out with the reason.": "In der Installationsanleitung nach den Bedingungen für den Aufstellungsort sehen. Was diese Maschine nicht braucht, mit Begründung auslassen."
  "Documentation: place of installation": "Dokumentation: Aufstellungsort"
  "Does it state, where needed, the room for removal and maintenance, what the cooling asks of the arrangement, the limits of the surroundings, functional limits such as starting currents and permitted voltage drop, and the measures for electromagnetic compatibility?": "Nennt sie, soweit nötig, den Raum für Demontage und Instandhaltung, die Anforderungen der Kühlung an die Anordnung, die Grenzwerte der Umgebung, funktionale Grenzen wie Anlaufströme und zulässigen Spannungsfall und die Maßnahmen zur elektromagnetischen Verträglichkeit?"
  "Look around the machine for metal pipes, fences, ladders and handrails within reach, about 2.5 m, and for what the instructions say about bonding them.": "Um die Maschine nach metallenen Rohren, Schutzzäunen, Leitern und Handläufen im Handbereich, etwa 2,5 m, sehen und nach dem, was die Anleitung zu deren Anschluss sagt."
  "Documentation: extraneous conductive parts": "Dokumentation: fremde leitfähige Teile"
  "Does it say how extraneous conductive parts that can be touched together with the machine, for example within 2.5 m, are connected to its protective bonding: metal pipes, fences, ladders, handrails?": "Sagt sie, wie fremde leitfähige Teile, die gleichzeitig mit der Maschine berührt werden können, etwa innerhalb 2,5 m, mit deren Schutzpotentialausgleich verbunden werden: metallene Rohre, Schutzzäune, Leitern, Handläufe?"
  "EN 60204-1, 17.2 d)": "EN 60204-1, 17.2 d)"
  "Look in the operating instructions for a layout drawing or overview and for the parts on setting up, restarting and the sequence of operations.": "In der Bedienungsanleitung nach einem Aufbauplan oder einer Übersicht suchen und nach den Teilen zu Einrichten, Neustart und Ablauf."
  "Documentation: function and operation": "Dokumentation: Funktion und Betrieb"
  "Does it hold, where needed, an overview of the layout of the electrical equipment, the procedures for programming or configuring, for restarting after an unexpected stop, and the sequence of operations?": "Enthält sie, soweit nötig, eine Übersicht vom Aufbau der elektrischen Ausrüstung, die Verfahren zum Programmieren oder Konfigurieren und zum Neustart nach einem unerwarteten Stopp sowie die Abfolge der Abläufe?"
  "EN 60204-1, 17.2 e)": "EN 60204-1, 17.2 e)"
  "Look for the part on maintenance, the circuit diagrams or connection tables and the list of spare parts. Take a sample: find one component of the cabinet in the diagram.": "Nach dem Teil zur Instandhaltung, den Stromlaufplänen oder Anschlusstabellen und der Ersatzteilliste suchen. Stichprobe: ein Bauteil aus dem Schaltschrank im Plan finden."
  "Documentation: maintenance": "Dokumentation: Instandhaltung"
  "Does it state how often and how functions are tested, how to maintain safely, how to adjust and repair, the connections of the components for their replacement, by circuit diagrams or connection tables, and the special tools and spare parts?": "Nennt sie Häufigkeit und Verfahren von Funktionstests, das Vorgehen für eine sichere Instandhaltung, für Justierung und Reparatur, die Anschlüsse der Komponenten für den Austausch, durch Stromlaufpläne oder Anschlusstabellen, sowie besondere Werkzeuge und Ersatzteile?"
  "EN 60204-1, 17.2 f)": "EN 60204-1, 17.2 f)"
  "Look for the part on safety and for a list of settings: parameters, DIP switches. Where the machine has safety functions, look for how they are tested.": "Nach dem Teil zur Sicherheit und einer Liste der Einstellungen suchen: Parameter, DIP-Schalter. Hat die Maschine Sicherheitsfunktionen, nachsehen, wie sie geprüft werden."
  "Documentation: residual risks and settings": "Dokumentation: Restrisiken und Einstellungen"
  "Does it name residual risks, the training and protective equipment needed, the restriction of access by key or tool to skilled or instructed persons, the settings such as DIP switches and parameter values, and how safety-related control functions are verified after repairs and at periodic tests?": "Nennt sie Restrisiken, nötige Schulung und Schutzausrüstung, die Beschränkung des Zugangs mit Schlüssel oder Werkzeug auf Elektrofachkräfte oder unterwiesene Personen, die Einstellungen wie DIP-Schalter und Parameterwerte und die Überprüfung sicherheitsrelevanter Steuerungsfunktionen nach Reparaturen und bei Wiederholungsprüfungen?"
  "Look for the parts on transport, storage and disposal. For a machine that stands in place a short statement is enough.": "Nach den Teilen zu Transport, Lagerung und Entsorgung suchen. Bei einer aufgestellten Maschine genügt eine kurze Angabe."
  "Documentation: transport and disposal": "Dokumentation: Transport und Entsorgung"
  "Circuits the disconnecting device leaves live": "Stromkreise, die die Netztrenneinrichtung nicht abschaltet"
  "Where circuits stay live with the supply disconnecting device off: is there a durable warning near its handle, does the maintenance manual name them, and are they told apart by the colour of their conductors, by separate laying or by warning labels?": "Wo Stromkreise bei ausgeschalteter Netztrenneinrichtung unter Spannung bleiben: Gibt es ein dauerhaftes Warnschild nahe ihrer Bedienvorrichtung, nennt das Wartungshandbuch sie, und sind sie durch Leiterfarbe, getrennte Verlegung oder Warnschilder unterscheidbar?"
  "Look in the diagram for circuits tapped in front of the disconnecting device: lighting and socket-outlets for maintenance, undervoltage release, supplies of memories or heaters. Without such circuits leave the step out with that reason.": "Im Stromlaufplan nach Stromkreisen suchen, die vor der Netztrenneinrichtung abgehen: Beleuchtung und Steckdosen für die Instandhaltung, Unterspannungsauslöser, Versorgung von Speichern oder Heizungen. Ohne solche Stromkreise den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 5.3.5": "EN 60204-1, 5.3.5"
  "Prevention of unexpected start-up": "Verhinderung von unerwartetem Anlauf"
  "Are there means to interrupt the energy supply against an unexpected start-up, easy to identify, and can they be secured in the OFF position where they stand outside a closed electrical operating area?": "Gibt es Einrichtungen zur Unterbrechung der Energiezufuhr gegen unerwarteten Anlauf, sind sie leicht zu erkennen, und lassen sie sich in der AUS-Stellung sichern, wo sie außerhalb einer abgeschlossenen elektrischen Betriebsstätte stehen?"
  "Find the device for each part somebody works at, and look for the provision for a padlock. A contactor or a drive with safe torque off serves for inspection and adjustment only.": "Die Einrichtung für jeden Teil suchen, an dem jemand arbeitet, und nach der Vorkehrung für ein Vorhängeschloss sehen. Ein Schütz oder ein Antrieb mit sicher abgeschaltetem Moment genügt nur für Inspektion und Einstellung."
  "EN 60204-1, 5.4, 5.6": "EN 60204-1, 5.4, 5.6"
  "Devices for isolating": "Einrichtungen zum Trennen"
  "Can the equipment or its parts be isolated for work on them, by devices that are easy to reach and that show which part or circuit they isolate?": "Lassen sich die Ausrüstung oder ihre Teile für Arbeiten daran trennen, mit Einrichtungen, die gut zugänglich sind und erkennen lassen, welchen Teil oder Stromkreis sie trennen?"
  "Where parts are worked on one by one, each needs a device of its own. Disconnectors and withdrawable fuse links count only inside a closed electrical operating area.": "Wo an Teilen einzeln gearbeitet wird, braucht jeder eine eigene Einrichtung. Trennschalter und herausziehbare Sicherungseinsätze zählen nur in einer abgeschlossenen elektrischen Betriebsstätte."
  "EN 60204-1, 5.5": "EN 60204-1, 5.5"
  "Equipment within reach of the public": "Ausrüstung im Zugriff der Öffentlichkeit"
  "Where the equipment is accessible to the general public, children included: are live parts protected to at least IP4X or IPXXD, or fully covered with insulation?": "Wo die Ausrüstung der Öffentlichkeit einschließlich Kindern zugänglich ist: Sind aktive Teile mindestens in IP4X oder IPXXD geschützt oder vollständig isoliert?"
  "A machine in a workshop is not accessible to the public: leave the step out with that reason.": "Eine Maschine in einer Werkstatt ist der Öffentlichkeit nicht zugänglich: den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 6.2.1": "EN 60204-1, 6.2.1"
  "Overcurrent protection": "Überstromschutz"
  "Is every circuit protected against overcurrent at the point where the cross-section is reduced, with a rating or setting that fits the conductor and the load?": "Ist jeder Stromkreis dort gegen Überstrom geschützt, wo der Querschnitt kleiner wird, mit einem Bemessungs- oder Einstellwert, der zu Leiter und Last passt?"
  "Take samples: compare the protective device with the diagram and with the conductor behind it. A reduced conductor may run unprotected for at most 3 m when it carries its load and is laid safe from short circuits.": "Stichproben: das Schutzorgan mit dem Stromlaufplan und mit dem Leiter dahinter vergleichen. Ein verjüngter Leiter darf höchstens 3 m ungeschützt laufen, wenn er seine Last trägt und kurzschlusssicher verlegt ist."
  "EN 60204-1, 7.2.1, 7.2.8, 7.2.10": "EN 60204-1, 7.2.1, 7.2.8, 7.2.10"
  "Short-circuit current rating": "Bemessungskurzschlussstrom"
  "Is the short-circuit current rating of the equipment stated, and is it at least as high as the short-circuit current to be expected at the place of installation?": "Ist der Bemessungskurzschlussstrom der Ausrüstung angegeben, und ist er mindestens so groß wie der am Aufstellungsort zu erwartende Kurzschlussstrom?"
  "Read the rating from the documentation and compare it with the short-circuit current at the supply: stated by the operator or taken from the loop impedance measured there.": "Den Wert aus der Dokumentation lesen und mit dem Kurzschlussstrom an der Einspeisung vergleichen: vom Betreiber angegeben oder aus der dort gemessenen Schleifenimpedanz."
  "EN 60204-1, 7.2.9, 7.10": "EN 60204-1, 7.2.9, 7.10"
  "Protection of motors against overheating": "Schutz der Motoren gegen Überhitzung"
  "Has every motor above 0.5 kW a protection against overheating, by overload protection, temperature detection or current limiting, set to the motor?": "Hat jeder Motor über 0,5 kW einen Schutz gegen unzulässige Erwärmung, durch Überlastschutz, Übertemperaturschutz oder Strombegrenzung, eingestellt auf den Motor?"
  "Take samples: compare the setting of the motor protective device with the rated current on the rating plate of its motor.": "Stichproben: die Einstellung des Motorschutzes mit dem Bemessungsstrom auf dem Typenschild seines Motors vergleichen."
  "EN 60204-1, 7.3": "EN 60204-1, 7.3"
  "Cross-sections of the conductors": "Querschnitte der Leiter"
  "Do the cross-sections fit: at least the minimum for their place and use, and a current-carrying capacity that the protective device in front does not exceed?": "Passen die Querschnitte: mindestens der Mindestquerschnitt für Ort und Anwendung, und eine Strombelastbarkeit, die das vorgeschaltete Schutzorgan nicht überschreitet?"
  "Take samples with tables 5 and 6 of the standard. Copper in PVC at +40 °C in a duct carries about 13.5 A at 1.5 mm², 18.3 A at 2.5 mm², 24 A at 4 mm² and 31 A at 6 mm²; several loaded circuits together carry less.": "Stichproben mit den Tabellen 5 und 6 der Norm. Kupfer in PVC bei +40 °C im Kanal trägt etwa 13,5 A bei 1,5 mm², 18,3 A bei 2,5 mm², 24 A bei 4 mm² und 31 A bei 6 mm²; mehrere belastete Stromkreise nebeneinander tragen weniger."
  "EN 60204-1, 12.2, 12.4": "EN 60204-1, 12.2, 12.4"
  "Wiring to doors and moving parts": "Verdrahtung zu Türen und beweglichen Teilen"
  "Are devices on doors and other moving parts connected with flexible conductors that are anchored on the fixed and on the moving part?": "Sind Geräte an Türen und anderen beweglichen Teilen mit flexiblen Leitern angeschlossen, die am feststehenden und am beweglichen Teil abgefangen sind?"
  "Open the doors of the cabinet fully and look at the loops of the wiring and at the protective conductor of the door.": "Die Schranktüren ganz öffnen und die Leiterschleifen sowie den Schutzleiter der Tür ansehen."
  "EN 60204-1, 13.3": "EN 60204-1, 13.3"
  "Cable runs outside the enclosures": "Leitungswege außerhalb der Gehäuse"
  "Do the conductors run from terminal to terminal without joints, in ducts or adequately protected, with ducts and trays rigidly supported and clear of moving parts?": "Laufen die Leiter ohne Verbinder von Klemme zu Klemme, in Leitungskanälen oder ausreichend geschützt, mit starr gestützten Kanälen und Kabelwannen in Abstand zu beweglichen Teilen?"
  "Follow the cables from the cabinet to the machine. Above walkways ducts and trays lie at least 2 m above the working level; the entries keep the degree of protection of the enclosure.": "Den Leitungen vom Schrank zur Maschine folgen. In Durchgangsbereichen liegen Kanäle und Kabelwannen mindestens 2 m über der Arbeitsebene; die Einführungen erhalten die Schutzart des Gehäuses."
  "EN 60204-1, 13.1.2, 13.4.2, 13.5.1": "EN 60204-1, 13.1.2, 13.4.2, 13.5.1"
  "Cables to moving parts of the machine": "Leitungen zu beweglichen Maschinenteilen"
  "Are the cables to moving parts flexible, free of pull and sharp bends at their fixing points, protected against being run over or chafed, and at least 25 mm away from moving parts?": "Sind die Leitungen zu beweglichen Teilen flexibel, an ihren Befestigungen frei von Zug und scharfen Biegungen, gegen Überfahren und Scheuern geschützt und mindestens 25 mm von beweglichen Teilen entfernt?"
  "Move the axes through their travel and watch the cables. A loop needs the bending radius of the cable maker, otherwise at least ten times the diameter of the cable.": "Die Achsen über ihren Weg fahren und die Leitungen beobachten. Eine Schleife braucht den Biegeradius des Leitungsherstellers, sonst mindestens das Zehnfache des Leitungsdurchmessers."
  "EN 60204-1, 13.4.3, 12.6": "EN 60204-1, 13.4.3, 12.6"
  "Plug and socket combinations": "Stecker/Steckdosen-Kombinationen"
  "Do plug and socket combinations prevent touching live parts while they are mated and separated, does the protective contact make first and break last, are those rated above 16 A latched and those from 30 A interlocked with a switch, and can mating pairs not be mixed up?": "Verhindern Stecker/Steckdosen-Kombinationen das Berühren aktiver Teile beim Stecken und Trennen, schließt der Schutzkontakt voreilend und öffnet nacheilend, sind die über 16 A verriegelt und die ab 30 A mit einem Schalter verriegelt, und lassen sich zusammengehörige Paare nicht verwechseln?"
  "Look at each kind of connector on the machine. The part that stays live after separation is at least IP2X or IPXXB; metal housings are connected to the protective bonding circuit, which the protective conductor measurement shows.": "Jede Art von Steckverbindung an der Maschine ansehen. Das Teil, das nach dem Trennen unter Spannung bleibt, hat mindestens IP2X oder IPXXB; Metallgehäuse sind an das Schutzleitersystem angeschlossen, was die Schutzleitermessung zeigt."
  "EN 60204-1, 13.4.5": "EN 60204-1, 13.4.5"
  "Colours of indicator lights": "Farben der Anzeigeleuchten"
  "Do the indicator lights follow the colour code, red for an emergency, yellow for an abnormal state, blue for a mandatory action, green for normal and white for neutral, and does an illuminated emergency stop actuator stay red?": "Folgen die Anzeigeleuchten dem Farbcode, Rot für Notfall, Gelb für anormal, Blau für eine zwingende Handlung, Grün für normal und Weiß für neutral, und bleibt ein beleuchtetes Not-Halt-Bedienteil rot?"
  "Compare the lights at the operator stations and on the signal tower, which reads red, yellow, blue, green, white from the top.": "Die Leuchten an den Bedienstationen und an der Signalsäule vergleichen, die von oben Rot, Gelb, Blau, Grün, Weiß zeigt."
  "EN 60204-1, 10.3.2, 10.4": "EN 60204-1, 10.3.2, 10.4"
  "Local lighting of the machine": "Arbeitsplatzbeleuchtung der Maschine"
  "Is the local lighting supplied with at most 250 V between conductors, from an isolating transformer or a circuit of its own with overcurrent protection, with its on/off switch neither in the lampholder nor in the flexible cord?": "Wird die Arbeitsplatzbeleuchtung mit höchstens 250 V zwischen den Leitern versorgt, über einen Trenntransformator oder einen eigenen Stromkreis mit Überstromschutz, und sitzt ihr EIN/AUS-Schalter weder in der Fassung noch in der flexiblen Anschlussleitung?"
  "Find the lighting circuit in the diagram; at most 50 V are recommended. Without local lighting leave the step out with that reason.": "Den Lichtstromkreis im Stromlaufplan suchen; empfohlen sind höchstens 50 V. Ohne Arbeitsplatzbeleuchtung den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 15.2": "EN 60204-1, 15.2"
  "Motors and their mounting": "Motoren und ihr Einbau"
  "Are the motors protected against mechanical damage, accessible with their terminal boxes for inspection and replacement, and cooled sufficiently?": "Sind die Motoren gegen mechanische Beschädigung geschützt, mit ihren Klemmenkästen für Inspektion und Austausch zugänglich und ausreichend gekühlt?"
  "Look at each motor: free air intake, clean cooling fins, a degree of protection that fits its surroundings.": "Jeden Motor ansehen: freie Luftzufuhr, saubere Kühlrippen, eine Schutzart, die zur Umgebung passt."
  "EN 60204-1, 14.2, 14.4": "EN 60204-1, 14.2, 14.4"
  "Conductor wires, conductor bars and slip-rings": "Schleifleitungen, Stromschienen und Schleifringkörper"
  "Where conductor wires, conductor bars or slip-rings are used: are they covered to at least IP2X or IPXXB, and have the protective conductor and the neutral a wire or a ring of their own?": "Wo Schleifleitungen, Stromschienen oder Schleifringkörper verwendet werden: Sind sie mindestens in IP2X oder IPXXB abgedeckt, und haben Schutzleiter und Neutralleiter je eine eigene Schleifleitung oder einen eigenen Schleifring?"
  "The continuity of the protective conductor over the sliding contact is measured with the protective conductor measurement, with the collector in several positions. Without sliding contacts leave the step out with that reason.": "Die Durchgängigkeit des Schutzleiters über den Schleifkontakt wird mit der Schutzleitermessung gemessen, mit dem Stromabnehmer in mehreren Stellungen. Ohne Schleifkontakte den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 12.7.1, 12.7.2": "EN 60204-1, 12.7.1, 12.7.2"
  "Doors of electrical operating areas": "Türen elektrischer Betriebsstätten"
  "Are doors in gangways and to electrical operating areas at least 0.7 m wide and 2.0 m high, do they open outwards, and can they be opened from inside without a key or tool?": "Sind Türen in Gängen und zu elektrischen Betriebsstätten mindestens 0,7 m breit und 2,0 m hoch, öffnen sie nach außen, und lassen sie sich von innen ohne Schlüssel oder Werkzeug öffnen?"
  "Measure the clear opening. Without an electrical operating area that can be entered leave the step out with that reason.": "Die lichte Öffnung messen. Ohne begehbare elektrische Betriebsstätte den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 11.5": "EN 60204-1, 11.5"
  "Surroundings at the place of installation": "Umgebung am Aufstellungsort"
  "Do the surroundings fit what the equipment is built for: air temperature outside the enclosures between +5 °C and +40 °C, relative humidity at most 50 % at +40 °C, no condensation?": "Passt die Umgebung zu dem, wofür die Ausrüstung gebaut ist: Lufttemperatur außerhalb der Gehäuse zwischen +5 °C und +40 °C, relative Luftfeuchte höchstens 50 % bei +40 °C, keine Betauung?"
  "Measure temperature and humidity near the cabinet. At lower temperatures more humidity is permitted, for example 90 % at 20 °C; the documentation may state other limits.": "Temperatur und Luftfeuchte nahe dem Schrank messen. Bei niedrigerer Temperatur ist mehr Feuchte zulässig, zum Beispiel 90 % bei 20 °C; die Dokumentation kann andere Grenzen nennen."
  "EN 60204-1, 4.4.3, 4.4.4": "EN 60204-1, 4.4.3, 4.4.4"
  "Machine – functional tests to EN 60204-1": "Maschine – Funktionsprüfungen nach EN 60204-1"
  "Emergency stop: every device stops": "Not-Halt: jedes Gerät stoppt"
  "Does every emergency stop device stop the hazardous movement as fast as possible, in every mode of operation and before every other function?": "Stoppt jedes Not-Halt-Gerät die gefahrbringende Bewegung so schnell wie möglich, in jeder Betriebsart und mit Vorrang vor allen anderen Funktionen?"
  "Agree the test with the operator of the machine and run it without a workpiece where that is possible. Actuate one device after the other, each in every mode of operation, and note the ones tested.": "Die Prüfung mit dem Betreiber der Maschine abstimmen und, wo möglich, ohne Werkstück fahren. Ein Gerät nach dem anderen betätigen, jedes in jeder Betriebsart, und die geprüften notieren."
  "EN 60204-1, 9.2.3.4.2": "EN 60204-1, 9.2.3.4.2"
  "Emergency stop: command stays, reset starts nothing": "Not-Halt: Befehl bleibt, Rücksetzen startet nichts"
  "Does the stop command stay until the actuated device is reset by hand, does resetting only allow a restart without starting the machine, and is a restart impossible while any emergency stop is still actuated?": "Bleibt der Haltbefehl bestehen, bis das betätigte Gerät von Hand zurückgesetzt ist, ermöglicht das Rücksetzen nur den Wiederanlauf, ohne die Maschine in Gang zu setzen, und ist ein Wiederanlauf unmöglich, solange noch ein Not-Halt betätigt ist?"
  "With one device actuated try to start: nothing moves. Reset it: nothing moves. Start deliberately: the machine runs. With two devices actuated reset only one and try to start.": "Bei betätigtem Gerät starten: Nichts bewegt sich. Zurücksetzen: Nichts bewegt sich. Bewusst starten: Die Maschine läuft. Bei zwei betätigten Geräten nur eines zurücksetzen und starten versuchen."
  "EN 60204-1, 9.2.3.4.1": "EN 60204-1, 9.2.3.4.1"
  "Emergency switching off": "Not-Aus"
  "Where emergency switching off is provided: does it switch off the supply of the drives concerned, and can nothing be switched on again before every command is reset?": "Wo ein Not-Aus vorgesehen ist: Schaltet er die Stromversorgung der betroffenen Antriebe ab, und lässt sich nichts wieder einschalten, bevor jeder Befehl zurückgesetzt ist?"
  "Actuate each device and check with the voltage measurement that the circuit concerned is dead. Without emergency switching off leave the step out with that reason.": "Jedes Gerät betätigen und mit der Spannungsmessung prüfen, dass der betroffene Stromkreis spannungsfrei ist. Ohne Not-Aus den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 9.2.3.4.3": "EN 60204-1, 9.2.3.4.3"
  "Stop overrides start": "Stopp hat Vorrang vor Start"
  "Does a stop command override the start that belongs to it, and is it effective from every operator station where the risk assessment asks for that?": "Setzt ein Stopp-Befehl den zugehörigen Start außer Kraft, und wirkt er von jeder Bedienstation, an der die Risikobeurteilung das verlangt?"
  "Hold stop actuated and press start: nothing starts. Repeat at every operator station.": "Stopp betätigt halten und Start drücken: Nichts läuft an. An jeder Bedienstation wiederholen."
  "EN 60204-1, 9.2.3.3": "EN 60204-1, 9.2.3.3"
  "Start only with the safeguards in place": "Start nur mit wirksamen Schutzmaßnahmen"
  "Is a start only possible when all safety functions and protective measures are in place and ready, and where a start needs several operator stations: must all start devices be released and then actuated together?": "Ist ein Start nur möglich, wenn alle Sicherheitsfunktionen und Schutzmaßnahmen in Stellung und betriebsbereit sind, und müssen dort, wo ein Start mehrere Bedienstationen braucht, alle Starteinrichtungen in Ruhestellung sein und dann gemeinsam betätigt werden?"
  "Open one guard or leave one safeguard not ready and try to start; do this for each of them. With several stations hold one start device actuated beforehand: no start.": "Eine Schutzeinrichtung öffnen oder eine Schutzmaßnahme nicht bereit lassen und starten versuchen; das für jede wiederholen. Bei mehreren Stationen eine Starteinrichtung vorher betätigt halten: kein Start."
  "EN 60204-1, 9.2.3.2": "EN 60204-1, 9.2.3.2"
  "Interlocked guards": "Verriegelte Schutzeinrichtungen"
  "Does opening an interlocked guard stop the hazardous function, and does closing or resetting it start nothing by itself?": "Stoppt das Öffnen einer verriegelten Schutzeinrichtung die gefahrbringende Funktion, und löst ihr Schließen oder Rücksetzen von selbst keinen Betrieb aus?"
  "Open every interlocked guard once during operation without a workpiece, then close it again and watch the machine.": "Jede verriegelte Schutzeinrichtung einmal im Betrieb ohne Werkstück öffnen, wieder schließen und die Maschine beobachten."
  "EN 60204-1, 9.3.1": "EN 60204-1, 9.3.1"
  "Modes of operation": "Betriebsarten"
  "Can the mode selector be locked in every position or is it restricted by an access code, does selecting a mode start nothing, and is the selected mode indicated?": "Lässt sich der Betriebsartenwahlschalter in jeder Stellung verriegeln oder ist er durch einen Zugangscode beschränkt, setzt die Anwahl nichts in Gang, und wird die angewählte Betriebsart angezeigt?"
  "Switch through every mode and compare the indication with the position. A machine with one mode only: leave the step out with that reason.": "Jede Betriebsart durchschalten und die Anzeige mit der Stellung vergleichen. Bei einer Maschine mit nur einer Betriebsart den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 9.2.3.5": "EN 60204-1, 9.2.3.5"
  "Operation with safeguards suspended": "Betrieb mit aufgehobenen Schutzmaßnahmen"
  "In the mode that suspends safeguards, for setting or maintenance: are all other modes disabled, is movement possible only with an enabling device or a similar control in view of the hazardous parts, and only at reduced speed, force or in steps?": "In der Betriebsart, die Schutzmaßnahmen aufhebt, zum Einrichten oder Warten: Sind alle anderen Betriebsarten gesperrt, ist Bewegung nur mit einem Zustimmgerät oder ähnlichem Steuergerät mit Sicht auf die gefahrbringenden Teile möglich, und nur mit reduzierter Geschwindigkeit, Kraft oder im Schrittbetrieb?"
  "Select the setting mode, try to start the automatic cycle and move an axis with and without the enabling device.": "Den Einrichtbetrieb anwählen, den Automatikablauf zu starten versuchen und eine Achse mit und ohne Zustimmgerät bewegen."
  "EN 60204-1, 9.3.6": "EN 60204-1, 9.3.6"
  "Enabling device": "Zustimmeinrichtung"
  "Does movement stop when the enabling device is released, with three positions also when it is pressed through, and does returning from the pressed-through position not enable again?": "Stoppt die Bewegung beim Loslassen der Zustimmeinrichtung, bei drei Stellungen auch beim Durchdrücken, und gibt die Rückkehr aus der durchgedrückten Stellung nicht wieder frei?"
  "Move at reduced speed, release the device, then press it through and let it come back slowly.": "Mit reduzierter Geschwindigkeit fahren, das Gerät loslassen, dann durchdrücken und langsam zurückkommen lassen."
  "EN 60204-1, 9.2.3.9, 10.9": "EN 60204-1, 9.2.3.9, 10.9"
  "Hold-to-run controls": "Befehlseinrichtungen mit selbsttätiger Rückstellung"
  "Do hold-to-run controls need to be held all the time, and does the movement stop when they are released?": "Erfordern Befehlseinrichtungen mit selbsttätiger Rückstellung ständiges Betätigen, und stoppt die Bewegung beim Loslassen?"
  "Jog every axis or function that has such a control and release it.": "Jede Achse oder Funktion mit einer solchen Einrichtung tippen und loslassen."
  "EN 60204-1, 9.2.3.7": "EN 60204-1, 9.2.3.7"
  "Two-hand control": "Zweihandschaltung"
  "Does the two-hand control need both actuators at the same time, stop when either is released, need both released before a new start, and for type III accept only an actuation within 0.5 s?": "Erfordert die Zweihandschaltung beide Stellteile gleichzeitig, stoppt sie beim Loslassen eines Stellteils, verlangt sie vor einem neuen Start das Loslassen beider, und nimmt sie bei Typ III nur eine Betätigung innerhalb von 0,5 s an?"
  "Try each actuator alone, both with a clear delay, and release one during the stroke. The type is in the documentation.": "Jedes Stellteil einzeln versuchen, beide mit deutlichem Zeitversatz, und während des Hubs eines loslassen. Der Typ steht in der Dokumentation."
  "EN 60204-1, 9.2.3.8": "EN 60204-1, 9.2.3.8"
  "Operating limits": "Betriebsgrenzen"
  "Do the devices that detect an operating limit being overrun, such as travel, speed or pressure, bring about the intended reaction, and is an automatic restart prevented after overspeed?": "Führen die Einrichtungen, die das Überschreiten einer Betriebsgrenze erkennen, etwa Weg, Geschwindigkeit oder Druck, die vorgesehene Reaktion herbei, und ist nach Überdrehzahl ein automatischer Wiederanlauf verhindert?"
  "Approach each travel limit at low speed or actuate the limit switch by hand with the drive enabled. Limits that cannot be reached safely are checked by the documentation and noted so.": "Jede Wegbegrenzung langsam anfahren oder den Endschalter bei freigegebenem Antrieb von Hand betätigen. Grenzen, die sich nicht gefahrlos erreichen lassen, anhand der Dokumentation prüfen und so vermerken."
  "EN 60204-1, 9.3.2, 9.2.3.6, 7.6": "EN 60204-1, 9.3.2, 9.2.3.6, 7.6"
  "Interlocks between opposing movements": "Verriegelung gegenläufiger Bewegungen"
  "Are functions whose simultaneous operation is hazardous, such as opposing movements and reversing contactors, interlocked against each other?": "Sind Funktionen, deren gleichzeitige Betätigung gefährden kann, etwa gegenläufige Bewegungen und Wendeschütze, gegeneinander verriegelt?"
  "Give both commands at once at the operator station: only one or none is carried out.": "Beide Befehle an der Bedienstation gleichzeitig geben: Nur einer oder keiner wird ausgeführt."
  "EN 60204-1, 9.3.4": "EN 60204-1, 9.3.4"
  "Auxiliary functions": "Hilfsfunktionen"
  "Is the working of auxiliary functions such as lubrication, coolant supply or swarf removal monitored, and does the machine react as intended when one of them fails?": "Wird das Arbeiten von Hilfsfunktionen wie Schmierung, Kühlmittelversorgung oder Spänebeseitigung überwacht, und reagiert die Maschine wie vorgesehen, wenn eine ausfällt?"
  "Switch one auxiliary function off at its protective device or simulate its sensor, as the documentation allows.": "Eine Hilfsfunktion an ihrem Schutzorgan ausschalten oder ihren Fühler simulieren, soweit die Dokumentation das zulässt."
  "EN 60204-1, 9.3.3": "EN 60204-1, 9.3.3"
  "Return of the supply": "Spannungswiederkehr"
  "After an interruption of the supply: does the machine stay stopped when the voltage returns, until it is started deliberately?": "Nach einer Unterbrechung der Stromversorgung: Bleibt die Maschine bei Spannungswiederkehr stehen, bis sie bewusst gestartet wird?"
  "With the machine running without a workpiece switch the supply disconnecting device off and on again.": "Bei laufender Maschine ohne Werkstück die Netztrenneinrichtung aus- und wieder einschalten."
  "EN 60204-1, 7.5": "EN 60204-1, 7.5"
  "Phase sequence": "Drehfeld"
  "Where a wrong phase sequence can cause a hazard or damage: is there a protection against it, and do the drives turn in the right direction?": "Wo ein falsches Drehfeld gefährden oder schaden kann: Gibt es einen Schutz dagegen, und drehen die Antriebe in der richtigen Richtung?"
  "Measure the phase sequence at the supply and compare the direction of one drive with its arrow. A mobile machine or one with a plug needs the protection.": "Das Drehfeld an der Einspeisung messen und die Drehrichtung eines Antriebs mit seinem Pfeil vergleichen. Eine fahrbare Maschine oder eine mit Stecker braucht den Schutz."
  "EN 60204-1, 7.8": "EN 60204-1, 7.8"
  "Warning devices and indicators": "Warneinrichtungen und Anzeigen"
  "Do the visual and audible warning devices work, can they be checked, and do the indicator lights show the state of the machine?": "Arbeiten die optischen und akustischen Warneinrichtungen, lassen sie sich überprüfen, und zeigen die Anzeigeleuchten den Zustand der Maschine?"
  "Use the lamp test where there is one and watch the warning before a hazardous operation starts.": "Den Lampentest nutzen, wo es einen gibt, und die Warnung vor Beginn einer gefährlichen Operation beobachten."
  "EN 60204-1, 10.3.1, 9.2.3.2": "EN 60204-1, 10.3.1, 9.2.3.2"
  "Cableless control": "Kabellose Steuerung"
  "With a cableless control: is its effectiveness indicated, does the machine stop by itself when the link is lost, and does it stay stopped when the link returns?": "Bei einer kabellosen Steuerung: Wird ihre Wirksamkeit angezeigt, stoppt die Maschine von selbst, wenn die Verbindung verloren geht, und bleibt sie stehen, wenn die Verbindung wiederkehrt?"
  "Switch the control station off during a movement without a load, or take it out of range. Without a cableless control leave the step out with that reason.": "Die Steuerstelle während einer Bewegung ohne Last ausschalten oder außer Reichweite bringen. Ohne kabellose Steuerung den Messschritt mit dieser Begründung auslassen."
  "EN 60204-1, 9.2.4.2": "EN 60204-1, 9.2.4.2"
  "Functions as documented": "Funktionen wie dokumentiert"
  "Do the functions of the electrical equipment work as the documentation describes them?": "Arbeiten die Funktionen der elektrischen Ausrüstung so, wie die Dokumentation sie beschreibt?"
  "Run one complete cycle in every mode and compare it with the description of the sequence in the operating instructions.": "In jeder Betriebsart einen vollständigen Ablauf fahren und mit der Beschreibung der Abfolge in der Bedienungsanleitung vergleichen."
  "EN 60204-1, 18.6": "EN 60204-1, 18.6"
  "Kinds of document for this, after Annex I: a list of documents (IEC 62027), product specifications (IEC/PAS 62569-1) and documents structured to IEC 62023. Simple equipment may have all information in a single document.": "Dokumentarten dafür nach Anhang I: eine Dokumentenliste (IEC 62027), Produktspezifikationen (IEC/PAS 62569-1) und nach IEC 62023 strukturierte Dokumente. Bei einfacher Ausrüstung dürfen alle Informationen in einem einzigen Dokument stehen."
  "Kinds of document for this, after Annex I: instructions for installation, erection and assembly on site (IEC 82079-1), circuit diagrams and connection diagrams (IEC 61082-1).": "Dokumentarten dafür nach Anhang I: Gebrauchsanleitungen für Installation, Errichtung und Zusammenbau am Verwendungsort (IEC 82079-1), Stromlaufpläne und Verbindungsdiagramme (IEC 61082-1)."
  "Kinds of document for this, after Annex I: instructions for installation and erection (IEC 82079-1) and an overview drawing of the equipment with its overall dimensions (IEC 61082-1).": "Dokumentarten dafür nach Anhang I: Gebrauchsanleitungen für Installation und Errichtung (IEC 82079-1) und eine Übersichtszeichnung der Ausrüstung mit Gesamtabmessungen (IEC 61082-1)."
  "Kind of document for this, after Annex I: instructions for installation and erection (IEC 82079-1).": "Dokumentart dafür nach Anhang I: Gebrauchsanleitungen für Installation und Errichtung (IEC 82079-1)."
  "Kinds of document for this, after Annex I: operating instructions (IEC 82079-1) and an overview drawing of the equipment (IEC 61082-1).": "Dokumentarten dafür nach Anhang I: Bedienungsanleitungen (IEC 82079-1) und eine Übersichtszeichnung der Ausrüstung (IEC 61082-1)."
  "Kinds of document for this, after Annex I: instructions for inspection and maintenance (IEC 82079-1); circuit diagrams, connection diagrams, terminal lists, cable lists and an overview of the cable routes (IEC 61082-1); a parts list and a list of spare parts for a set period (IEC 62027); a list of tools.": "Dokumentarten dafür nach Anhang I: Gebrauchsanleitungen für Inspektion und Wartung (IEC 82079-1); Stromlaufpläne, Verbindungsdiagramme, Klemmenlisten, Kabellisten und eine Übersicht der Kabeltrassen (IEC 61082-1); eine Stückliste und eine Ersatzteilliste für einen festgelegten Zeitraum (IEC 62027); eine Liste der Werkzeuge."
  "Kinds of document for this, after Annex I: instructions for inspection and maintenance (IEC 82079-1) and a list of parameters, for example for converters.": "Dokumentarten dafür nach Anhang I: Gebrauchsanleitungen für Inspektion und Wartung (IEC 82079-1) und eine Parameterliste, zum Beispiel für Umrichter."
  "Kinds of document for this, after Annex I: instructions for handling, transport and storage and instructions for dismantling (IEC 82079-1).": "Dokumentarten dafür nach Anhang I: Gebrauchsanleitungen für Handhabung, Transport und Lagerung sowie für die Demontage (IEC 82079-1)."
  "Annex I names the standards the designations follow: IEC 81346-1 and IEC 81346-2 for reference designations, IEC 61666 for terminals, IEC 62491 for cables and cores.": "Anhang I nennt die Normen, denen die Kennzeichnung folgt: IEC 81346-1 und IEC 81346-2 für Referenzkennzeichen, IEC 61666 für Klemmen, IEC 62491 für Kabel und Adern."
  "Does it state, where needed, how to handle, transport and store the equipment, and how to dismantle it and treat its components?": "Nennt sie, soweit nötig, Handhabung, Transport und Lagerung der Ausrüstung sowie deren Demontage und die Behandlung der Komponenten?"
  "EN 60204-1, 17.2 g), h)": "EN 60204-1, 17.2 g), h)"
  "Take samples with the circuit diagram at the open cabinet, dead: the supply, the protective devices with their ratings and settings, a motor circuit, a control circuit. Note every difference.": "Stichproben mit dem Stromlaufplan am offenen, spannungsfreien Schaltschrank: Einspeisung, Schutzeinrichtungen mit Bemessungswerten und Einstellungen, ein Motorstromkreis, ein Steuerstromkreis. Jede Abweichung notieren."
  "Agreement with the documentation": "Übereinstimmung mit der Dokumentation"
  "Does the electrical equipment agree with its technical documentation?": "Stimmt die elektrische Ausrüstung mit ihrer technischen Dokumentation überein?"
  "EN 60204-1, 18.1 a)": "EN 60204-1, 18.1 a)"
  "Look at the enclosure near the incoming supply, where the standard recommends the marking. Read it from where one stands once the machine is installed.": "Am Gehäuse nahe der Einspeisung nachsehen, wo die Norm die Angaben empfiehlt. Von dort lesen, wo man bei aufgestellter Maschine steht."
  "Marking of the enclosure": "Kennzeichnung des Gehäuses"
  "Does the enclosure on the supply show, legible and durable, the supplier and for every supply the nominal voltage, the number of line conductors, the frequency and the full-load current?": "Trägt das Gehäuse am Netzanschluss lesbar und dauerhaft den Lieferanten und für jede Einspeisung Nennspannung, Anzahl der Außenleiter, Frequenz und Volllaststrom?"
  "EN 60204-1, 16.4": "EN 60204-1, 16.4"
  "Take samples: choose three components in the cabinet and one at the machine, read the designation on each and find the same one in the diagram.": "Stichproben: drei Bauteile im Schaltschrank und eines an der Maschine wählen, das Kennzeichen am Bauteil lesen und dasselbe im Plan finden."
  "Reference designations": "Referenzkennzeichen"
  "Can every enclosure, assembly, control device and component be identified by the reference designation the documentation shows?": "Sind alle Gehäuse, Baugruppen, Steuergeräte und Komponenten mit dem Referenzkennzeichen der Dokumentation identifizierbar?"
  "EN 60204-1, 16.5": "EN 60204-1, 16.5"
  "Go round the machine and look at every enclosure. No sign is needed on the enclosure of the supply disconnecting device, on operator stations and on single devices with an enclosure of their own.": "Um die Maschine gehen und jedes Gehäuse ansehen. Kein Schild brauchen das Gehäuse der Netztrenneinrichtung, Bedienstationen und einzelne Geräte mit eigenem Gehäuse."
  "Warning signs": "Warnschilder"
  "Do enclosures that do not clearly show that they hold electrical equipment carry the warning sign ISO 7010-W012, clearly visible on the door or cover?": "Tragen Gehäuse, bei denen nicht klar erkennbar ist, dass sie elektrische Betriebsmittel enthalten, deutlich sichtbar auf Tür oder Abdeckung das Warnschild ISO 7010-W012?"
  "EN 60204-1, 16.2.1": "EN 60204-1, 16.2.1"
  "Look at heat sinks, braking resistors, heaters and motors within reach. Where the documentation names hot surfaces, the sign has to be there.": "Kühlkörper, Bremswiderstände, Heizungen und Motoren im Handbereich ansehen. Wo die Dokumentation heiße Oberflächen nennt, muss das Zeichen vorhanden sein."
  "Hot surfaces": "Heiße Oberflächen"
  "Where the risk assessment asks for it: is there a warning of hot surfaces with the sign ISO 7010-W017?": "Wo die Risikobeurteilung es verlangt: Wird mit dem Zeichen ISO 7010-W017 vor heißen Oberflächen gewarnt?"
  "EN 60204-1, 16.2.2": "EN 60204-1, 16.2.2"
  "Go through every push-button, switch and indicator light: its function is written or shown by a symbol on or beside it, and still legible.": "Jeden Taster, Schalter und jede Meldeleuchte durchgehen: Die Funktion steht als Text oder Symbol darauf oder daneben und ist noch lesbar."
  "Marking of control devices": "Kennzeichnung der Steuergeräte"
  "Are control devices and visual indicators marked with their function, clearly and durably, on or beside them?": "Sind Steuergeräte und optische Anzeigen eindeutig und dauerhaft mit ihrer Funktion gekennzeichnet, auf oder neben dem Betriebsmittel?"
  "EN 60204-1, 16.3": "EN 60204-1, 16.3"
  "Open the terminal compartment of the supply, dead. Look for the markings of the line conductors and of N, and for a link between N and PE: there must be none, except one at the point of supply on a TN-C system.": "Den Anschlussraum der Einspeisung öffnen, spannungsfrei. Nach den Bezeichnungen der Außenleiter und von N sehen und nach einer Brücke zwischen N und PE: Es darf keine geben, außer einer an der Netzanschlussstelle im TN-C-System."
  "Terminals of the incoming supply": "Klemmen des Netzanschlusses"
  "Are the terminals of the incoming supply clearly marked, a neutral conductor on an insulated terminal of its own marked N, and N not connected to the protective bonding circuit inside the equipment?": "Sind die Klemmen des Netzanschlusses deutlich gekennzeichnet, liegt ein Neutralleiter auf einer eigenen isolierten Klemme mit der Bezeichnung N, und ist N innerhalb der Ausrüstung nicht mit dem Schutzleitersystem verbunden?"
  "EN 60204-1, 5.1": "EN 60204-1, 5.1"
  "In the same compartment look for the terminal marked PE. Its conductor has the cross-section of the line conductors up to 16 mm², 16 mm² up to 35 mm², and half of theirs above that.": "Im selben Anschlussraum die mit PE bezeichnete Klemme suchen. Ihr Leiter hat bis 16 mm² den Querschnitt der Außenleiter, bis 35 mm² 16 mm², darüber die Hälfte."
  "Terminal of the external protective conductor": "Klemme des externen Schutzleiters"
  "Is there, in the same terminal compartment as the line conductors, a terminal for the external protective conductor, marked PE and of a size to suit them?": "Gibt es im selben Anschlussraum wie die Außenleiter eine Klemme für den externen Schutzleiter, mit PE bezeichnet und passend zu deren Querschnitt bemessen?"
  "EN 60204-1, 5.2": "EN 60204-1, 5.2"
  "At the main switch: only O and I, and a place for a padlock in the O position; try it. Where a plug disconnects, there has to be a switch to switch the machine on and off.": "Am Hauptschalter: nur O und I, und eine Möglichkeit für ein Vorhängeschloss in Stellung O; ausprobieren. Trennt ein Stecker, muss es einen Schalter zum Ein- und Ausschalten der Maschine geben."
  "Supply disconnecting device": "Netztrenneinrichtung"
  "Does every incoming supply have a supply disconnecting device: a switch with only an OFF and an ON position, marked O and I and lockable in OFF, or a plug and socket combination?": "Hat jeder Netzanschluss eine Netztrenneinrichtung: einen Schalter mit nur einer AUS- und einer EIN-Stellung, mit O und I gekennzeichnet und in AUS abschließbar, oder eine Stecker/Steckdosen-Kombination?"
  "EN 60204-1, 5.3.2, 5.3.3": "EN 60204-1, 5.3.2, 5.3.3"
  "Measure the height of the handle above the floor one stands on. Where a plug disconnects, leave the step out with that reason.": "Die Höhe des Griffs über der Standfläche messen. Trennt ein Stecker, den Messschritt mit dieser Begründung auslassen."
  "Handle of the disconnecting device": "Bedienvorrichtung der Netztrenneinrichtung"
  "Is the operating means of the supply disconnecting device outside the enclosure, easy to reach and between 0.6 m and 1.9 m above the access level?": "Liegt die Bedienvorrichtung der Netztrenneinrichtung außerhalb des Gehäuses, leicht zugänglich und zwischen 0,6 m und 1,9 m über der Zugangsebene?"
  "EN 60204-1, 5.3.4": "EN 60204-1, 5.3.4"
  "Try doors and covers: they open only with a key or tool, or the main switch interlocks the door. With the door open, dead: what can be touched while resetting or adjusting is covered finger-safe.": "Türen und Abdeckungen probieren: Sie öffnen nur mit Schlüssel oder Werkzeug, oder der Hauptschalter verriegelt die Tür. Bei offener Tür, spannungsfrei: Was beim Zurücksetzen oder Einstellen berührt werden kann, ist fingersicher abgedeckt."
  "Protection by enclosures": "Schutz durch Gehäuse"
  "Are live parts inside enclosures protected to at least IP2X or IPXXB, and can an enclosure be opened only with a key or tool, or once its live parts are disconnected?": "Sind aktive Teile in Gehäusen mindestens nach IP2X oder IPXXB geschützt, und lässt sich ein Gehäuse nur mit Schlüssel oder Werkzeug öffnen oder erst, wenn seine aktiven Teile abgeschaltet sind?"
  "EN 60204-1, 6.2.2": "EN 60204-1, 6.2.2"
  "Read the IP rating from the plate of the enclosure or from the documentation. Look for open cable entries, missing blanking plugs, damaged seals and holes left over from mounting.": "Die Schutzart vom Gehäuseschild oder aus der Dokumentation ablesen. Nach offenen Leitungseinführungen, fehlenden Blindstopfen, beschädigten Dichtungen und übrig gebliebenen Befestigungslöchern suchen."
  "Degree of protection": "Schutzart"
  "Do the enclosures of the controlgear suit the surroundings, with at least IP22, and do openings such as cable entries keep the degree of protection?": "Passen die Gehäuse der Schaltgeräte zur Umgebung, mit mindestens IP22, und halten Öffnungen wie Leitungseinführungen die Schutzart ein?"
  "EN 60204-1, 11.3, 11.4": "EN 60204-1, 11.3, 11.4"
  "Follow the protective conductor from the PE terminal: motor housings, mounting plate, enclosure. Look for a fuse, switch or link in its path; there must be none. Its continuity is measured as test 1.": "Den Schutzleiter von der PE-Klemme aus verfolgen: Motorgehäuse, Montageplatte, Gehäuse. Nach Sicherung, Schalter oder Trennstelle in seinem Weg suchen; es darf keine geben. Die Durchgängigkeit wird als Prüfung 1 gemessen."
  "Protective bonding circuit": "Schutzleitersystem"
  "Are the exposed conductive parts of the electrical equipment and the structural parts used for bonding connected to the protective bonding circuit, with no switching or overcurrent device in it?": "Sind die Körper der elektrischen Ausrüstung und die für den Schutzpotentialausgleich genutzten Konstruktionsteile an das Schutzleitersystem angeschlossen, ohne Schaltgerät oder Überstromschutzeinrichtung darin?"
  "EN 60204-1, 8.2.1, 8.2.3": "EN 60204-1, 8.2.1, 8.2.3"
  "Look at every door and cover that carries equipment: a green-and-yellow conductor to it, or hinges and fasteners that make contact. Without a conductor, measure across it with test 1.": "Jede Tür und Abdeckung mit Ausrüstung ansehen: ein grün-gelber Leiter dorthin, oder Scharniere und Befestigungen mit Kontakt. Ohne Leiter den Übergang mit Prüfung 1 messen."
  "Equipment on doors and covers": "Ausrüstung an Türen und Abdeckungen"
  "Where electrical equipment is mounted on lids, doors or cover plates: is the continuity of the protective bonding circuit ensured, by a protective conductor or by fasteners of low resistance?": "Wo elektrische Ausrüstung an Deckeln, Türen oder Abdeckplatten befestigt ist: Ist die Durchgängigkeit des Schutzleitersystems sichergestellt, durch einen Schutzleiter oder niederohmige Befestigungen?"
  "EN 60204-1, 8.2.3": "EN 60204-1, 8.2.3"
  "Look at the conductors in the cabinet and at the terminals: green-and-yellow on protective conductors only; bare or braided ones carry PE or the symbol at their ends.": "Die Leiter im Schaltschrank und an den Klemmen ansehen: grün-gelb nur an Schutzleitern; blanke oder geflochtene tragen PE oder das Symbol an den Enden."
  "Identification of the protective conductor": "Kennzeichnung des Schutzleiters"
  "Is every protective conductor clearly told apart from other conductors, by GREEN-AND-YELLOW or at its ends by the letters PE or the symbol IEC 60417-5019, and is GREEN-AND-YELLOW used for nothing else?": "Ist jeder Schutzleiter deutlich von anderen Leitern zu unterscheiden, durch GRÜN-GELB oder an den Enden durch die Buchstaben PE oder das Symbol IEC 60417-5019, und wird GRÜN-GELB für nichts anderes verwendet?"
  "EN 60204-1, 13.2.2": "EN 60204-1, 13.2.2"
  "Look at the terminal N and the conductors on it: blue, and no blue conductor that could be taken for it used otherwise.": "Die Klemme N und die Leiter daran ansehen: blau, und kein blauer Leiter, der mit ihm verwechselt werden könnte, anders verwendet."
  "Identification of the neutral conductor": "Kennzeichnung des Neutralleiters"
  "Is a neutral conductor that is identified by colour alone BLUE, and is that colour used for no other conductor it could be confused with?": "Ist ein nur durch Farbe gekennzeichneter Neutralleiter BLAU, und wird diese Farbe für keinen anderen Leiter verwendet, mit dem er verwechselt werden könnte?"
  "EN 60204-1, 13.2.3": "EN 60204-1, 13.2.3"
  "Take samples: choose three conductors at their terminals and find number or colour in the diagram; compare the markings of one terminal block with the diagram.": "Stichproben: drei Leiter an ihren Klemmen wählen und Nummer oder Farbe im Plan finden; die Bezeichnungen einer Klemmenleiste mit dem Plan vergleichen."
  "Identification of conductors and terminals": "Kennzeichnung von Leitern und Klemmen"
  "Can each conductor be identified at each termination by means of the documentation, and do the terminals of terminal blocks carry the markings of the diagrams?": "Ist jeder Leiter an jedem Anschluss mit Hilfe der Dokumentation identifizierbar, und tragen die Klemmen der Klemmenleisten die Kennzeichnung der Pläne?"
  "EN 60204-1, 13.2.1, 13.1.1": "EN 60204-1, 13.2.1, 13.1.1"
  "Dead: look at the terminals and pull lightly at the conductors, the protective conductors first. Stranded conductors carry ferrules where the terminal is not made for them.": "Spannungsfrei: die Klemmen ansehen und leicht an den Leitern ziehen, zuerst an den Schutzleitern. Mehrdrähtige Leiter tragen Aderendhülsen, wo die Klemme nicht für sie gemacht ist."
  "Terminal connections": "Anschlüsse"
  "Are all connections, those of the protective bonding circuit in particular, secured against loosening, with one protective conductor only at each terminal connecting point?": "Sind alle Anschlüsse, besonders die des Schutzleitersystems, gegen Selbstlockern gesichert, mit nur einem Schutzleiter je Klemmenanschlusspunkt?"
  "EN 60204-1, 13.1.1": "EN 60204-1, 13.1.1"
  "At the supply of the extra-low voltage: marked as a safety isolating transformer or as a SELV/PELV supply, and 0 V or one side wired to the PE bar. The voltage is at most 60 V DC or 25 V AC in dry locations; it is measured.": "An der Stromversorgung der Kleinspannung: als Sicherheitstrenntransformator oder SELV/PELV-Netzteil gekennzeichnet, und 0 V oder eine Seite an der PE-Schiene angeschlossen. Die Spannung beträgt in trockenen Räumen höchstens 60 V Gleich- oder 25 V Wechselspannung; sie wird gemessen."
  "PELV circuits": "PELV-Stromkreise"
  "Is one side of every PELV circuit connected to the protective bonding circuit, its source of a permitted kind, and are its conductors run apart from other circuits or insulated for them?": "Ist eine Seite jedes PELV-Stromkreises an das Schutzleitersystem angeschlossen, die Stromquelle von zulässiger Art, und sind die Leiter von anderen Stromkreisen getrennt verlegt oder dafür isoliert?"
  "EN 60204-1, 6.4.1, 6.4.2": "EN 60204-1, 6.4.1, 6.4.2"
  "In the diagram and the cabinet: the control transformer or power supply and the connection of its common conductor to PE at the supply. Coils sit directly on the common conductor, contacts in the switched one.": "Im Plan und im Schaltschrank: Steuertransformator oder Netzteil und die Verbindung des gemeinsamen Leiters mit PE an der Einspeisung. Spulen liegen direkt am gemeinsamen Leiter, Kontakte im geschalteten."
  "Control circuits": "Steuerstromkreise"
  "Are control circuits fed from AC supplied through a transformer with separate windings, and is the common conductor of an earthed control circuit connected to the protective bonding circuit at the point of supply?": "Werden Steuerstromkreise an Wechselspannung über einen Transformator mit getrennten Wicklungen versorgt, und ist der gemeinsame Leiter eines geerdeten Steuerstromkreises am Einspeisepunkt mit dem Schutzleitersystem verbunden?"
  "EN 60204-1, 9.1.1, 9.4.3.1": "EN 60204-1, 9.1.1, 9.4.3.1"
  "Go through the operator stations and compare the colour of each actuator with its function.": "Die Bedienstationen durchgehen und die Farbe jedes Bedienteils mit seiner Funktion vergleichen."
  "Colours of actuators": "Farben der Bedienteile"
  "Are the actuators for emergency stop and emergency switching off RED, on YELLOW where they have a background, START actuators not RED and STOP actuators not GREEN?": "Sind die Bedienteile für Not-Halt und Not-Aus ROT, auf GELB, wo sie einen Hintergrund haben, START-Bedienteile nicht ROT und STOPP-Bedienteile nicht GRÜN?"
  "EN 60204-1, 10.2.1": "EN 60204-1, 10.2.1"
  "Stand at every place where somebody works at the machine: an emergency stop device is within reach. Whether it works belongs to the functional tests.": "An jeden Platz stellen, an dem jemand an der Maschine arbeitet: Ein Not-Halt-Gerät ist erreichbar. Ob es wirkt, gehört zu den Funktionsprüfungen."
  "Emergency stop devices": "Geräte für Not-Halt"
  "Are emergency stop devices easy to reach and present wherever an emergency stop may have to be given?": "Sind Geräte für Not-Halt leicht erreichbar und überall vorhanden, wo ein Not-Halt-Befehl nötig werden kann?"
  "EN 60204-1, 10.7.1": "EN 60204-1, 10.7.1"
  "Look for socket-outlets on the machine and in the cabinet and find their circuit in the diagram: an RCD of at most 30 mA in front. Without socket-outlets leave the step out with that reason.": "Nach Steckdosen an der Maschine und im Schaltschrank suchen und ihren Stromkreis im Plan finden: ein RCD mit höchstens 30 mA davor. Ohne Steckdosen den Messschritt mit dieser Begründung auslassen."
  "Socket-outlets for accessories": "Steckdosen für Zubehör"
  "Where the machine has socket-outlets for accessories: are those up to 20 A protected in addition by an RCD of at most 30 mA, and does the protective bonding circuit reach them?": "Wo die Maschine Steckdosen für Zubehör hat: Sind die bis 20 A zusätzlich durch einen RCD mit höchstens 30 mA geschützt, und reicht das Schutzleitersystem bis zu ihnen?"
  "EN 60204-1, 15.1": "EN 60204-1, 15.1"
  "Look in the documentation for the leakage current; drives and filters are the usual source. It is measured with a clamp around the protective conductor.": "In der Dokumentation nach dem Ableitstrom sehen; Antriebe und Filter sind die übliche Quelle. Gemessen wird er mit einer Zange um den Schutzleiter."
  "Earth leakage current above 10 mA": "Erdableitstrom über 10 mA"
  "Where the earth leakage current in a protective conductor exceeds 10 mA: is one of the measures of 8.2.6 taken and named in the installation instructions?": "Wo der Erdableitstrom in einem Schutzleiter 10 mA überschreitet: Ist eine der Maßnahmen nach 8.2.6 getroffen und in den Installationsanweisungen genannt?"
  "EN 60204-1, 8.2.6, 18.1 g)": "EN 60204-1, 8.2.6, 18.1 g)"
