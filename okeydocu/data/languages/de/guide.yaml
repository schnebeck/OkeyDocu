  "The element the new one is placed below in the structure, such as the distribution board the RCD sits in. The choice stays for every further new element of this campaign until it is changed.": "Das Element, unter dem das neue im Strukturbaum eingeordnet wird, etwa der Verteiler, in dem der FI sitzt. Die Wahl bleibt für alle weiteren neuen Elemente dieser Kampagne stehen, bis sie geändert wird."
