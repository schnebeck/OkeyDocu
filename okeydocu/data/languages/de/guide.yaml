  No element chosen yet: Noch kein Element gewählt
  no element chosen: kein Element gewählt
  Where do we measure?: Wo messen wir?
  Choose the element this test is for.: Das Element wählen, für das dieser Test ist.
  Details from the rating plate: Angaben vom Typenschild
  Missing details are stored at the element. Without them the drawing shows the usual layout.: Fehlende Angaben werden am Element gespeichert. Ohne sie zeigt die Zeichnung die übliche Bauform.
  Prepared – next ▶: Vorbereitet – weiter ▶
  "＋ New {kind} …": "＋ {kind} neu anlegen …"
  "{title} (new)": "{title} (neu)"
  New element: Neues Element
