# OkeyDocu - German texts of the guided first measurement.
texts:
  Test leads: Messleitungen
  Supply: Versorgung
  Mode and limits: Modus und Grenzwerte
  Measure: Messen
  Outgoing: Abgang
  Incoming: Zuleitung
  "for {element}": "für {element}"
  first measurement: erste Messung
  ◀ Back: ◀ Zurück
  Next ▶: Weiter ▶
  Done ▶: Fertig ▶
  Connected – next ▶: Angeschlossen – weiter ▶
  "Leads {plugs} are plugged into their rows of sockets.": "Die Kabel {plugs} stecken in ihren Buchsenreihen."
  RCD tripping test IΔN: RCD-Auslöseprüfung IΔN
  RCD, outgoing side: FI-Schutzschalter, Abgangsseite
  Place probe PE (L2) on the PE bar.: Spitze PE (L2) an die PE-Schiene setzen.
  Place probe L (L1) on outgoing terminal 2 of the RCD.: Spitze L (L1) an Abgangsklemme 2 des FI setzen.
  Place probe N (L3) on outgoing terminal N of the RCD.: Spitze N (L3) an Abgangsklemme N des FI setzen.
  The test switches the circuit off. Secure the loads beforehand.: Die Messung schaltet den Stromkreis ab. Verbraucher vorher sichern.
  Inform the operator: Betreiber informieren
  The test switches the circuit off.: Die Messung schaltet den Stromkreis ab.
  Secure the loads: Verbraucher sichern
  "Save data, stop running machines.": "Daten speichern, laufende Maschinen anhalten."
  Leave it switched on: Eingeschaltet lassen
  The RCD and the circuit stay on.: Der FI und der Stromkreis bleiben ein.
  Live: Unter Spannung
  De-energised: Spannungsfrei
  The circuit stays switched on.: Der Stromkreis bleibt eingeschaltet.
  "Switch off, secure against switching on again, verify that it is dead.": "Freischalten, gegen Wiedereinschalten sichern, Spannungsfreiheit feststellen."
  No element chosen yet: Noch kein Element gewählt
  no element chosen: kein Element gewählt
  Where do we measure?: Wo messen wir?
  Choose the element this test is for.: Das Element wählen, für das diese Messung ist.
  Details from the rating plate: Angaben vom Typenschild
  Missing details are stored at the element. Without them the drawing shows the usual layout.: Fehlende Angaben werden am Element gespeichert. Ohne sie zeigt die Zeichnung die übliche Bauform.
  Prepared – next ▶: Vorbereitet – weiter ▶
  "＋ New {kind} …": "＋ {kind} neu anlegen …"
  "{title} (new)": "{title} (neu)"
  New element: Neues Element
  Parent element: Übergeordnetes Element
  "The element the new one is placed below in the structure, such as the distribution board the RCD sits in. The choice stays for every further new element of this campaign until it is changed.": "Das Element, unter dem das neue im Strukturbaum eingeordnet wird, etwa der Verteiler, in dem der FI sitzt. Die Wahl bleibt für alle weiteren neuen Elemente dieser Kampagne stehen, bis sie geändert wird."
  "Turn the rotary switch to {position}.": "Drehschalter auf {position} stellen."
  "Measures the touch voltage and the tripping time at the rated residual current.": "Misst die Berührspannung und die Auslösezeit beim Bemessungsdifferenzstrom."
  "No instrument connected: turn the switch, then go on.": "Kein Messgerät verbunden: Schalter drehen, dann weiter."
  The switch is set right.: Der Drehschalter steht richtig.
  a position without a measurement: eine Stellung ohne Messung
  "The instrument is set to {position}.": "Das Messgerät steht auf {position}."
  Turned – next ▶: Gedreht – weiter ▶
  Ask the instrument again: Gerät erneut abfragen
  Take it ▶: Übernehmen ▶
  Set – next ▶: Eingestellt – weiter ▶
  repeat measurement: Wiederholmessung
  "Press the softkey beside a setting, choose the value with the arrow keys, confirm it and take it over with ✓.": "Softkey neben der Einstellung drücken, den Wert mit den Pfeiltasten wählen, bestätigen und mit ✓ übernehmen."
  Received: Empfangen
  Further measurements of this kind go straight to the chosen element.: Weitere Messungen dieser Art gehen direkt an das gewählte Element.
  This measurement needs the mains.: Diese Messung braucht Netzversorgung.
  "Plug the mains lead into the inlet at the top right and switch on: 0 → I.": "Netzkabel oben rechts einstecken und einschalten: 0 → I."
  The MAINS lamp lights up.: Die Lampe MAINS leuchtet.
  The battery is enough for this measurement.: Für diese Messung reicht der Akku.
  Look at the BAT symbol at the top of the display. With a nearly empty battery plug in the mains lead and switch on.: Das Symbol BAT oben im Display ansehen. Ist der Akku fast leer, Netzkabel einstecken und einschalten.
  "{element} states:": "{element} gibt an:"
  Waiting for the result …: Warte auf das Ergebnis …
  Machine housing: Maschinengehäuse
  bare metal: blankes Metall
  CEE plug, contact side: CEE-Stecker, Kontaktseite
  Main switch: Hauptschalter
  "Limits: set them as the test basis requires.": "Grenzwerte: so einstellen, wie es die Prüfgrundlage verlangt."
  "Store the result with MEM: OkeyDocu receives it at once.": "Ergebnis mit MEM speichern: OkeyDocu empfängt es sofort."
  The voltage is measured on the live supply.: Die Spannung wird an der eingeschalteten Versorgung gemessen.
  Main switch, incoming terminals: Hauptschalter, Zuleitungsklemmen
  "Live parts are exposed: touch only the grips of the probes.": "Spannungsführende Teile liegen frei: Prüfspitzen nur an den Griffen anfassen."
  CEE plug and housing of the machine: CEE-Stecker und Gehäuse der Maschine
  "Measure only dead: the plug is pulled.": "Nur spannungsfrei messen: Der Stecker ist gezogen."
  Measures the voltage between the probes and its frequency.: Misst die Spannung zwischen den Prüfspitzen und ihre Frequenz.
  Measures the resistance of the protective conductor with 200 mA.: Misst den Widerstand des Schutzleiters mit 200 mA.
  Place probe L (L1) on the incoming line conductor L1.: Spitze L (L1) an den zugeführten Außenleiter L1 setzen.
  Place probe N (L3) on the incoming N, where there is one.: Spitze N (L3) an den zugeführten N setzen, sofern vorhanden.
  Place probe L (L1) on the PE contact of the CEE plug.: Spitze L (L1) an den PE-Kontakt des CEE-Steckers setzen.
  Place probe PE (L2) on a bare metal spot of the housing.: Spitze PE (L2) an eine blanke Metallstelle des Gehäuses setzen.
  "RCD: rated residual current IΔN, type and rated current IN, as the RCD states them.": "RCD: Bemessungsdifferenzstrom IΔN, Typ und Bemessungsstrom IN, wie der FI sie angibt."
  "Test current: waveform, 1 × IΔN and the earthing system.": "Prüfstrom: Kurvenform, 1 × IΔN und Netzform."
  "Press ON/START: the touch voltage is measured, the RCD does not trip yet.": "ON/START drücken: Die Berührungsspannung wird gemessen, der FI löst noch nicht aus."
  "Press IΔN: the RCD trips and the tripping time is measured.": "IΔN drücken: Der FI löst aus, die Auslösezeit wird gemessen."
  "Measuring path: AUTO measures L-PE, N-PE and L-N one after the other; without N choose L-PE.": "Messstrecke: AUTO misst L-PE, N-PE und L-N nacheinander; ohne N L-PE wählen."
  "Hold the probes in place: the voltage is shown at once.": "Prüfspitzen halten: Die Spannung erscheint sofort."
  Switch off and pull the plug: Ausschalten und Stecker ziehen
  The protective conductor is measured without voltage.: Der Schutzleiter wird spannungsfrei gemessen.
  Find a bare metal spot: Blanke Metallstelle suchen
  Paint and rust falsify the result.: Lack und Rost verfälschen das Ergebnis.
  "Polarity: both directions, the larger value counts.": "Polarität: beide Richtungen, der größere Wert zählt."
  "With an extension lead: compensate it first (ROFFSET).": "Mit Verlängerungsleitung: diese zuerst kompensieren (ROFFSET)."
  Press ON/START and hold the probes until the result stands.: ON/START drücken und die Prüfspitzen halten, bis das Ergebnis steht.
  Guided measurement …: Geführt messen …
  Next element …: Nächstes Element …
  Leads through the first measurement of this kind step by step.: Führt Schritt für Schritt durch die erste Messung dieser Art.
  Chooses or makes the element the next readings go to.: Wählt oder legt das Element an, an das die nächsten Messwerte gehen.
  not applicable: entfällt
  Measured between conductors the test point does not have, as the element states. Left out of the verdict and the report.: Zwischen Leitern gemessen, die es an der Prüfstelle laut Element nicht gibt. Zählt nicht zur Bewertung und steht nicht im Protokoll.
  "{value}, as stated above": "{value}, wie übergeordnet angegeben"
  "The test point lacks conductors AUTO would measure: choose the measuring path by hand. Readings against missing conductors are marked as not applicable.": "An der Prüfstelle fehlen Leiter, die AUTO messen würde: Messstrecke von Hand wählen. Messwerte gegen fehlende Leiter werden als „entfällt“ markiert."
