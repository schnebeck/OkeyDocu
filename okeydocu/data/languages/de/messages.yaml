# OkeyDocu - German texts: messages of the campaign, store, import and instrument parts.
texts:
  Standard report: Standardprotokoll
  Standard report, compact: Standardprotokoll, kompakt
  Outside every confirmed step: Außerhalb jedes bestätigten Messschritts
  Measuring function does not match the step: Messfunktion passt nicht zum Schritt
  "{name}: only pictures and PDF files can be attached.": "{name}: Nur Bilder und PDF lassen sich anhängen."
  "Instrument clock in sync, set at {time}": "Geräteuhr synchron, gestellt um {time}"
  "Instrument clock in sync, checked at {time}": "Geräteuhr synchron, geprüft um {time}"
  "Instrument clock in sync, stated by hand at {time}": "Geräteuhr synchron, von Hand festgelegt um {time}"
  "The instrument's clock could not be set, it is still {offset} s off. Please try again.": "Die Uhr des Messgeräts ließ sich nicht stellen, sie weicht weiter um {offset} s ab. Bitte erneut versuchen."
  Instrument clock not checked: Geräteuhr nicht geprüft
  "Instrument clock is {offset} s off, times are corrected": "Geräteuhr weicht {offset} s ab, Zeiten werden korrigiert"
  The instrument clock was set in this campaign. A single offset would not apply to all measurements.: In dieser Kampagne wurde die Geräteuhr gestellt. Ein einzelner Versatz würde nicht für alle Messungen gelten.
  "Photo missing: {name}": "Foto fehlt: {name}"
  "Photo changed: {name}": "Foto wurde verändert: {name}"
  "Attachment missing: {name}": "Anlage fehlt: {name}"
  "Attachment changed: {name}": "Anlage wurde verändert: {name}"
  "Step open: {title}": "Schritt offen: {title}"
  "{count} measurement not assigned to a step": "{count} Messung(en) keinem Schritt zugeordnet"
  "{count} measurements not assigned to a step": "{count} Messung(en) keinem Schritt zugeordnet"
  A campaign sealed earlier is missing.: Eine früher versiegelte Kampagne fehlt.
  The deletion note of an earlier campaign is not genuine.: Der Löschvermerk einer früheren Kampagne ist nicht echt.
  The data no longer match the seal.: Die Daten stimmen nicht mehr mit dem Siegel überein.
  The seal is not genuine.: Das Siegel ist nicht echt.
  The seal was set or removed without the key.: Das Siegel wurde ohne Schlüssel gesetzt oder entfernt.
  The campaign is closed.: Die Kampagne ist abgeschlossen.
  The title is missing.: Der Titel fehlt.
  Measurements or files are at places outside this installation.: Messungen oder Dateien liegen an Orten außerhalb dieser Anlage.
  "Expected: {columns}": "Erwartet: {columns}"
  "{field} cannot be changed.": "{field} lässt sich nicht ändern."
  "{title} (draft)": "{title} (Entwurf)"
  "Repeat of the inspection of {day}": "Wiederholung der Prüfung vom {day}"
  "Limit {label}: {now} instead of {before}": "Grenze {label}: {now} statt {before}"
  "{name}: {now} instead of {before}": "{name}: {now} statt {before}"
  "{label} notably higher than last time": "{label} deutlich höher als zuletzt"
  "{label} notably lower than last time": "{label} deutlich niedriger als zuletzt"
  "Last time on {day}: {values}": "Zuletzt am {day}: {values}"
  "{count} point of the repeat open: measure it or skip it with a reason": "{count} Punkt der Wiederholung offen: messen oder mit Begründung auslassen"
  "{count} points of the repeat open: measure them or skip them with a reason": "{count} Punkte der Wiederholung offen: messen oder mit Begründung auslassen"
  "Different setting at “{title}” without a reason": "Abweichende Einstellung bei „{title}“ ohne Begründung"
  Measurements of closed campaigns stay where they are.: Messungen abgeschlossener Kampagnen bleiben, wo sie sind.
  An element needs a name.: Ein Element braucht einen Namen.
  An element cannot be moved below itself.: Ein Element lässt sich nicht unter sich selbst schieben.
  Elements stay with their customer.: Elemente bleiben bei ihrem Kunden.
  A whole campaign hangs on this element or below it.: An diesem Element oder darunter hängt eine ganze Kampagne.
  Closed campaigns measured here and need the place.: Abgeschlossene Kampagnen haben hier gemessen und brauchen den Ort.
  "The database has version {found}, this program needs version {needed}. It has to be converted with an external tool first.": "Die Datenbank hat die Version {found}, dieses Programm braucht die Version {needed}. Sie muss vorher mit einem externen Werkzeug umgestellt werden."
  "Unknown customer fields: {fields}": "Unbekannte Kundenfelder: {fields}"
  The database holds no inspections.: Die Datenbank enthält keine Prüfungen.
  These inspections have already been imported.: Diese Prüfungen wurden schon importiert.
  Unnamed: Ohne Namen
  "Inspection of {day} (from IZYTRON)": "Prüfung vom {day} (aus IZYTRON)"
  "Exactly one customer is expected, found: {count}.": "Erwartet wird genau ein Kunde, gefunden: {count}."
  The installation tree holds nodes without a reachable parent.: Der Anlagenbaum enthält Knoten ohne erreichbaren Elternknoten.
  The clock of this instrument cannot be set.: Die Uhr dieses Messgeräts lässt sich nicht stellen.
  This instrument does not report its rotary switch.: Dieses Messgerät meldet seinen Drehschalter nicht.
  This instrument delivers no live results.: Dieses Messgerät liefert keine Live-Ergebnisse.
  This instrument delivers no texts.: Dieses Messgerät liefert keine Texte.
  Simulator (no hardware): Simulator (ohne Hardware)
  Virtual instrument: Virtuelles Messgerät
  The rotary switch has not been moved yet.: Der Drehschalter wurde noch nicht bewegt.
  No instrument found. Please connect it by USB or set it up once over Bluetooth.: Kein Messgerät gefunden. Bitte per USB anschließen oder einmal über Bluetooth einrichten.
  The connection to the instrument is not open.: Die Verbindung zum Messgerät ist nicht geöffnet.
  The clock cannot be set during Push/Print.: Die Uhr lässt sich nicht während Push/Print stellen.
  "Unexpected switch position: {text}": "Unerwartete Schalterstellung: {text}"
  The Bluetooth tools ended unexpectedly.: Die Bluetooth-Werkzeuge wurden unerwartet beendet.
  The instrument was not found. Please turn the rotary switch to Setup and, in the Bluetooth menu, switch Bluetooth on and make it visible.: Das Messgerät wurde nicht gefunden. Bitte Drehschalter auf Setup stellen und im Bluetooth-Menü Bluetooth einschalten und sichtbar stellen.
  Pairing failed. Please check the PIN and delete an old pairing on the instrument under “Trusted devices”.: Die Kopplung ist fehlgeschlagen. Bitte die PIN prüfen und am Messgerät unter „Vertraute Geräte“ eine alte Kopplung löschen.
  Pairing did not answer in time.: Die Kopplung hat nicht rechtzeitig geantwortet.
  "Bluetooth is not available: {error}": "Bluetooth ist nicht verfügbar: {error}"
  Searching for the instrument …: Suche das Messgerät …
  Instrument found, pairing …: Messgerät gefunden, kopple …
  The instrument is busy elsewhere and accepts no connection.: Das Messgerät ist gerade anderweitig belegt und nimmt keine Verbindung an.
  Three connections are already signed on at the instrument. Please switch it off and on again.: Am Messgerät sind schon drei Verbindungen angemeldet. Bitte es einmal aus- und wieder einschalten.
  The instrument could not be disconnected cleanly. Please switch it off and on again before measuring without the laptop. Otherwise it may not save measurements.: Das Messgerät konnte nicht sauber getrennt werden. Bitte es einmal aus- und wieder einschalten, bevor ohne Laptop gemessen wird. Sonst speichert es Messungen womöglich nicht.
  Push/Print is already running.: Push/Print läuft bereits.
  "The measurement could not be taken over: {error}": "Messung konnte nicht übernommen werden: {error}"
  A different instrument answered.: Es hat sich ein anderes Messgerät gemeldet.
  "The instrument texts cannot be read: {error}": "Die Gerätetexte sind nicht lesbar: {error}"
  The instrument delivered no texts.: Das Messgerät hat keine Texte geliefert.
  "Not on the list of allowed commands: {command}": "Nicht auf der Liste erlaubter Befehle: {command}"
  "No answer to {command}.": "Keine Antwort auf {command}."
  "The instrument reports error {code} on {command}.": "Das Messgerät meldet Fehler {code} auf {command}."
  The connection to the instrument broke off.: Die Verbindung zum Messgerät ist abgerissen.
  "No answer to {command}. Is the instrument switched on?": "Keine Antwort auf {command}. Ist das Messgerät eingeschaltet?"
  "Incomplete answer to {command} ({size} bytes).": "Unvollständige Antwort auf {command} ({size} Byte)."
  The instrument does not release its data right now (error 402). Please turn the rotary switch to Setup and check whether another program is connected.: Das Messgerät gibt die Daten gerade nicht frei (Fehler 402). Bitte den Drehschalter auf Setup stellen und prüfen, ob ein anderes Programm verbunden ist.
  "The checksum of the answer to {command} does not match.": "Prüfsumme der Antwort auf {command} stimmt nicht."
  The instrument does not answer. Please switch it on and enable Bluetooth.: Das Messgerät antwortet nicht. Bitte einschalten und Bluetooth aktivieren.
  The other side closed the connection.: Die Gegenstelle hat die Verbindung geschlossen.
  The instrument cannot be opened via USB. Another program may be connected to it.: Das Messgerät lässt sich über USB nicht öffnen. Vielleicht ist ein anderes Programm damit verbunden.
contexts:
  limit:
    none: keine
