  Whether and how long the RCD delays its tripping. A selective RCD upstream lets the RCD of the final circuit trip first.: Ob und wie lange der RCD seine Auslösung verzögert. Ein vorgeschalteter selektiver RCD lässt den RCD des Endstromkreises zuerst auslösen.
  At most 300 ms at IΔn, 150 ms at 2 × IΔn, 40 ms at 5 × IΔn: Höchstens 300 ms bei IΔn, 150 ms bei 2 × IΔn, 40 ms bei 5 × IΔn
  130 to 500 ms at IΔn, 60 to 200 ms at 2 × IΔn, 50 to 150 ms at 5 × IΔn: 130 bis 500 ms bei IΔn, 60 bis 200 ms bei 2 × IΔn, 50 bis 150 ms bei 5 × IΔn
  10 to 300 ms at IΔn: 10 bis 300 ms bei IΔn
  "Which forms of residual current the RCD detects. Electronics in a load, such as a frequency converter, can cause residual currents a type AC or A does not detect; smooth DC residual currents can even blind it to those it would detect. The type sets the test currents of the RCD test.": "Welche Formen von Fehlerstrom der RCD erfasst. Elektronik in einem Verbraucher, etwa ein Frequenzumrichter, kann Fehlerströme verursachen, die ein Typ AC oder A nicht erfasst; glatte Gleichfehlerströme können ihn sogar für die blind machen, die er erfassen würde. Der Typ bestimmt die Prüfströme der RCD-Prüfung."
  Detects sinusoidal residual currents only. Residual currents of electronic loads pass it unseen.: Erfasst nur sinusförmige Fehlerströme. Fehlerströme elektronischer Verbraucher bleiben ihm verborgen.
  Trips between 0.5 and 1 × IΔn: Löst zwischen 0,5 und 1 × IΔn aus
  The DC pre-magnetisation keeps it from tripping: Die Gleichstrom-Vormagnetisierung verhindert sein Auslösen
  "The usual type for final circuits: detects sinusoidal and pulsating DC residual currents. A smooth DC residual current above 6 mA can blind it.": "Der übliche Typ für Endstromkreise: erfasst sinusförmige und pulsierende Gleichfehlerströme. Ein glatter Gleichfehlerstrom über 6 mA kann ihn blind machen."
  "Sinusoidal: trips between 0.5 and 1 × IΔn; pulsating DC: between 0.35 and 1.4 × IΔn above 10 mA": "Sinusförmig: löst zwischen 0,5 und 1 × IΔn aus; pulsierender Gleichstrom: zwischen 0,35 und 1,4 × IΔn über 10 mA"
  "For single-phase frequency converters, as in washing machines: also detects residual currents of mixed frequencies up to 1 kHz and bears 10 mA of smooth DC.": "Für einphasige Frequenzumrichter, etwa in Waschmaschinen: erfasst auch Fehlerströme mit Mischfrequenzen bis 1 kHz und verträgt 10 mA glatten Gleichstrom."
  "Sinusoidal: trips between 0.5 and 1 × IΔn": "Sinusförmig: löst zwischen 0,5 und 1 × IΔn aus"
  "Measures with half the rated residual current, 15 mA at 30 mA": "Misst mit dem halben Bemessungsdifferenzstrom, 15 mA bei 30 mA"
  "Sensitive to all currents: also detects smooth DC residual currents, as three-phase frequency converters, PV inverters or charging points without a DC detection of their own cause them. A DC pre-magnetisation for the loop impedance would trip it.": "Allstromsensitiv: erfasst auch glatte Gleichfehlerströme, wie sie dreiphasige Frequenzumrichter, PV-Wechselrichter oder Ladepunkte ohne eigene DC-Erkennung verursachen. Eine Gleichstrom-Vormagnetisierung für die Schleifenimpedanz würde ihn auslösen."
  "Also with smooth DC: trips between 0.5 and 2 × IΔn": "Auch mit glattem Gleichstrom: löst zwischen 0,5 und 2 × IΔn aus"
  "As type B, for residual currents up to 20 kHz, and trips at 420 mA at most over the whole range: for preventive fire protection.": "Wie Typ B, für Fehlerströme bis 20 kHz, und löst im ganzen Bereich spätestens bei 420 mA aus: für den vorbeugenden Brandschutz."
  "How the supply and the exposed conductive parts are earthed. It decides how protection by disconnection works and so what is measured: the loop impedance in a TN system, the earthing resistance together with the RCD in a TT system, the insulation monitoring in an IT system.": "Wie Einspeisung und Körper geerdet sind. Davon hängt ab, wie der Schutz durch Abschaltung wirkt und damit, was gemessen wird: die Schleifenimpedanz im TN-System, der Erdungswiderstand zusammen mit dem RCD im TT-System, die Isolationsüberwachung im IT-System."
  The fault current flows back through the protective conductor and disconnects the protective device: Der Fehlerstrom fließt über den Schutzleiter zurück und schaltet die Schutzeinrichtung ab
  Continuity of the protective conductor: Durchgängigkeit des Schutzleiters
  "The PEN carries the operating current and would have to pass through the RCD, so a fault current flowing back on it cancels out: an RCD cannot work here and must not be used.": "Der PEN führt den Betriebsstrom und müsste durch den RCD geführt werden, sodass sich ein über ihn zurückfließender Fehlerstrom aufhebt: Ein RCD kann hier nicht wirken und darf nicht eingesetzt werden."
  "Once N and PE are split, they must not be joined again; RCDs work behind the split.": "Sind N und PE einmal aufgeteilt, dürfen sie nicht wieder verbunden werden; hinter der Aufteilung wirken RCDs."
  "The fault current flows back through the earth. A circuit breaker rarely disconnects in time, so an RCD protects; it holds where RA × IΔn ≤ 50 V.": "Der Fehlerstrom fließt über das Erdreich zurück. Ein Leitungsschutzschalter schaltet selten rechtzeitig ab, deshalb schützt ein RCD; das gelingt, wo RA × IΔn ≤ 50 V."
  "Touch voltage at IΔn, at most 50 V": "Berührungsspannung bei IΔn, höchstens 50 V"
  The loop through the earth gives an upper bound of the earthing resistance RA: Die Schleife über das Erdreich ergibt eine obere Grenze des Erdungswiderstands RA
  "A first fault to earth causes only a small current and need not disconnect; an insulation monitoring device reports it. A second fault has to disconnect as in a TN or TT system.": "Ein erster Fehler gegen Erde verursacht nur einen kleinen Strom und muss nicht abschalten; eine Isolationsüberwachung meldet ihn. Ein zweiter Fehler muss wie im TN- oder TT-System abschalten."
  Response of the insulation monitoring device: Ansprechen der Isolationsüberwachung
  Insulation resistance of the system: Isolationswiderstand des Netzes
  How a device protects against electric shock where its basic insulation fails.: Wie ein Gerät vor elektrischem Schlag schützt, wenn seine Basisisolierung versagt.
  From the plug or terminal to every touchable metal part: Vom Stecker oder der Anschlussklemme zu jedem berührbaren Metallteil
  "Active conductors against the protective conductor, at least 1 MΩ": "Aktive Leiter gegen den Schutzleiter, mindestens 1 MΩ"
  "Protective conductor current, at most 3.5 mA": "Schutzleiterstrom, höchstens 3,5 mA"
  "Active conductors against touchable conductive parts, at least 2 MΩ": "Aktive Leiter gegen berührbare leitfähige Teile, mindestens 2 MΩ"
  "Touch current at touchable conductive parts, at most 0.5 mA": "Berührungsstrom an berührbaren leitfähigen Teilen, höchstens 0,5 mA"
  "Mains circuit against the SELV circuit, at least 0.25 MΩ": "Netzstromkreis gegen den SELV-Stromkreis, mindestens 0,25 MΩ"
  The supply is a safety extra-low voltage: Die Versorgung ist eine Schutzkleinspannung
  "First digit: protection against solid objects and touch, second digit: against water. An X stands for a digit left open.": "Erste Ziffer: Schutz gegen Fremdkörper und Berühren, zweite Ziffer: gegen Wasser. Ein X steht für eine offen gelassene Ziffer."
  "5 to 6.25 × Iₙ, delayed": "5 bis 6,25 × Iₙ, verzögert"
  "8 to 12 × Iₙ, by maker up to 14 × Iₙ": "8 bis 12 × Iₙ, je nach Hersteller bis 14 × Iₙ"
  "A characteristic of Siemens, not in a standard, for the protection of semiconductors.": "Eine nicht genormte Charakteristik von Siemens für den Schutz von Halbleitern."
  "Characteristic of the circuit breaker, also of the breaker part of an RCBO. It gives the disconnecting current Iₐ for the loop impedance.": "Charakteristik des Leitungsschutzschalters, auch des LS-Teils eines FI/LS-Schalters. Sie ergibt den Abschaltstrom Iₐ für die Schleifenimpedanz."
  "Circuit breaker, older or maker-specific": "Leitungsschutzschalter, älter oder herstellereigen"
  "Distribution circuits and other final circuits: TN system": "Verteilerstromkreise und übrige Endstromkreise: TN-System"
  "Distribution circuits and other final circuits: TT system": "Verteilerstromkreise und übrige Endstromkreise: TT-System"
  "Final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A: TN system at U₀ 230 V": "Endstromkreise mit Steckdosen bis 63 A oder für ortsfeste Betriebsmittel bis 32 A: TN-System bei U₀ 230 V"
  "Final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A: TT system at U₀ 230 V, TN system at U₀ 400 V": "Endstromkreise mit Steckdosen bis 63 A oder für ortsfeste Betriebsmittel bis 32 A: TT-System bei U₀ 230 V, TN-System bei U₀ 400 V"
  "For high inrush currents, such as transformers. With Iₐ = 20 × Iₙ a D16 needs 320 A, so the loop impedance may be at most 0.72 Ω at U₀ 230 V.": "Für hohe Einschaltströme, etwa von Transformatoren. Mit Iₐ = 20 × Iₙ braucht ein D16 320 A, die Schleifenimpedanz darf bei U₀ 230 V also höchstens 0,72 Ω betragen."
  "For loads that draw a high current on switching on, such as motors and lamp groups. With Iₐ = 10 × Iₙ a C16 needs 160 A, so the loop impedance may be at most 1.44 Ω at U₀ 230 V.": "Für Verbraucher mit hohem Einschaltstrom, etwa Motoren und Lampengruppen. Mit Iₐ = 10 × Iₙ braucht ein C16 160 A, die Schleifenimpedanz darf bei U₀ 230 V also höchstens 1,44 Ω betragen."
  "For motors and transformers: rides through inrush currents, while its overload release is set closely to the rated current (IEC 60947-2). The PROFITEST takes Iₐ = 12 × Iₙ: a K16 needs 192 A, so the loop impedance may be at most 1.20 Ω at U₀ 230 V. Some makers give up to 14 × Iₙ; their data sheet then sets Iₐ.": "Für Motoren und Transformatoren: übersteht Einschaltströme, während die Überlastauslösung eng am Nennstrom liegt (IEC 60947-2). Der PROFITEST rechnet mit Iₐ = 12 × Iₙ: Ein K16 braucht 192 A, die Schleifenimpedanz darf bei U₀ 230 V also höchstens 1,20 Ω betragen. Manche Hersteller geben bis 14 × Iₙ an; dann bestimmt deren Datenblatt Iₐ."
  "For semiconductors, control and measuring circuits: trips at a low fault current already. With Iₐ = 3 × Iₙ a Z16 needs 48 A, so the loop impedance may be at most 4.79 Ω at U₀ 230 V.": "Für Halbleiter, Steuer- und Messkreise: löst schon bei kleinem Fehlerstrom aus. Mit Iₐ = 3 × Iₙ braucht ein Z16 48 A, die Schleifenimpedanz darf bei U₀ 230 V also höchstens 4,79 Ω betragen."
  "Full-range fuse for cables and lines, against overload and short circuit; gL is the older German name. Without a disconnection time the limit of the loop impedance is open: one of the entries gL/gG with a time sets it.": "Ganzbereichssicherung für Kabel und Leitungen, gegen Überlast und Kurzschluss; gL ist die ältere deutsche Bezeichnung. Ohne Abschaltzeit bleibt der Grenzwert der Schleifenimpedanz offen: Einer der Einträge gL/gG mit Zeit legt ihn fest."
  "Full-range fuse, judged by the disconnection time allowed in a TN system for distribution circuits and final circuits beyond those of 0.4 s. Iₐ is the current that melts the fuse within 5 s.": "Ganzbereichssicherung, beurteilt nach der Abschaltzeit, die im TN-System für Verteilerstromkreise und die übrigen Endstromkreise zulässig ist. Iₐ ist der Strom, der die Sicherung innerhalb von 5 s schmelzen lässt."
  "Full-range fuse, judged by the disconnection time allowed in a TT system for distribution circuits and final circuits beyond those of 0.2 s. Iₐ is the current that melts the fuse within 1 s.": "Ganzbereichssicherung, beurteilt nach der Abschaltzeit, die im TT-System für Verteilerstromkreise und die übrigen Endstromkreise zulässig ist. Iₐ ist der Strom, der die Sicherung innerhalb von 1 s schmelzen lässt."
  "Full-range fuse, judged by the disconnection time required for final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A in a TN system at U₀ 230 V, the most common case. Iₐ is the current that melts the fuse within 0.4 s; it comes from the time-current characteristic of the fuse at its rated current.": "Ganzbereichssicherung, beurteilt nach der Abschaltzeit, die für Endstromkreise mit Steckdosen bis 63 A oder für ortsfeste Betriebsmittel bis 32 A im TN-System bei U₀ 230 V gefordert ist, dem häufigsten Fall. Iₐ ist der Strom, der die Sicherung innerhalb von 0,4 s schmelzen lässt; er ergibt sich aus der Zeit-Strom-Kennlinie der Sicherung bei ihrem Nennstrom."
  "Full-range fuse, judged by the disconnection time required for final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A in a TT system at U₀ 230 V or a TN system at U₀ 400 V. Iₐ is the current that melts the fuse within 0.2 s; it comes from the time-current characteristic of the fuse at its rated current.": "Ganzbereichssicherung, beurteilt nach der Abschaltzeit, die für Endstromkreise mit Steckdosen bis 63 A oder für ortsfeste Betriebsmittel bis 32 A im TT-System bei U₀ 230 V oder im TN-System bei U₀ 400 V gefordert ist. Iₐ ist der Strom, der die Sicherung innerhalb von 0,2 s schmelzen lässt; er ergibt sich aus der Zeit-Strom-Kennlinie der Sicherung bei ihrem Nennstrom."
  "How fast the protective device of the circuit disconnects at which current. For the loop impedance it gives the disconnecting current Iₐ: the fault current at which the device disconnects within the required time. The loop impedance may be at most U₀ / Iₐ. The measured value is commonly held to two thirds of it (DIN VDE 0100-600, informative annex), as the conductors warm up in a fault and the measurement has its error.": "Wie schnell die Schutzeinrichtung des Stromkreises bei welchem Strom abschaltet. Für die Schleifenimpedanz ergibt sie den Abschaltstrom Iₐ: den Fehlerstrom, bei dem die Einrichtung in der geforderten Zeit abschaltet. Die Schleifenimpedanz darf höchstens U₀ / Iₐ betragen. Den Messwert hält man üblicherweise auf zwei Drittel davon (DIN VDE 0100-600, informativer Anhang), weil sich die Leiter im Fehlerfall erwärmen und die Messung einen Fehler hat."
  "In Germany the usual choice for socket and lighting circuits in homes. With Iₐ = 5 × Iₙ a B16 disconnects at 80 A; at U₀ 230 V the loop impedance may then be at most 230 V / 80 A = 2.88 Ω.": "In Deutschland üblich für Steckdosen- und Lichtstromkreise in Wohnungen. Mit Iₐ = 5 × Iₙ schaltet ein B16 bei 80 A ab; bei U₀ 230 V darf die Schleifenimpedanz dann höchstens 230 V / 80 A = 2,88 Ω betragen."
  "Limit Zs ≤ U₀ / Iₐ, Iₐ from the fuse curve at the disconnection time": "Grenzwert Zs ≤ U₀ / Iₐ, Iₐ aus der Sicherungskennlinie bei der Abschaltzeit"
  "Limit Zs ≤ U₀ / Iₐ, set on the instrument by characteristic and rated current": "Grenzwert Zs ≤ U₀ / Iₐ, am Gerät über Charakteristik und Nennstrom eingestellt"
  Main circuits: Hauptstromkreise
  "Old characteristic for the protection of devices, replaced by C; the PROFITEST takes it as C with Iₐ = 10 × Iₙ.": "Alte Charakteristik für den Geräteschutz, abgelöst durch C; der PROFITEST behandelt sie wie C mit Iₐ = 10 × Iₙ."
  "Old characteristic for the protection of lines, made until about 1990 and replaced by B; the PROFITEST takes it as B with Iₐ = 5 × Iₙ.": "Alte Charakteristik für den Leitungsschutz, bis etwa 1990 hergestellt und abgelöst durch B; der PROFITEST behandelt sie wie B mit Iₐ = 5 × Iₙ."
  "Older installations, today B": "Ältere Anlagen, heute B"
  "Older installations, today C": "Ältere Anlagen, heute C"
  "Partial-range fuse for motors: it breaks short circuits only, a motor protection relay has to guard against overload. Iₐ comes from the manufacturer's characteristic.": "Teilbereichssicherung für Motoren: Sie unterbricht nur Kurzschlüsse, gegen Überlast muss ein Motorschutzrelais schützen. Iₐ ergibt sich aus der Kennlinie des Herstellers."
  "Selective main circuit breaker (SLS)": "Selektiver Hauptleitungsschutzschalter (SLS)"
  "Selective main circuit breaker: its short-circuit release trips with a delay, so the circuit breakers behind it disconnect first. The PROFITEST takes Iₐ = 5 × Iₙ.": "Selektiver Hauptleitungsschutzschalter: Seine Kurzschlussauslösung löst verzögert aus, sodass die nachgeschalteten Leitungsschutzschalter zuerst abschalten. Der PROFITEST rechnet mit Iₐ = 5 × Iₙ."
  Semiconductors: Halbleiter
  Short-circuit current between the lines and voltage drop: Kurzschlussstrom zwischen den Außenleitern und Spannungsfall
  "Where an RCD of type AC or A protects the circuit too: does not trip it": "Wo zusätzlich ein RCD vom Typ AC oder A schützt: löst ihn nicht aus"
  under 0.2 s: unter 0,2 s
  "0, 1, 2 and 20, 21, 22": "0, 1, 2 und 20, 21, 22"
  0.6/1 kV: 0,6/1 kV
  "1, 2 and 21, 22": "1, 2 und 21, 22"
  2 and 22: 2 und 22
  "Connecting household appliances and power tools at medium stress, not outdoors for good": "Anschluss von Haushaltsgeräten und Elektrowerkzeugen bei mittlerer Beanspruchung, nicht dauerhaft im Freien"
  Construction: Aufbau
  "EPR insulation, polyurethane sheath, flexible": "EPR-Isolierung, Polyurethanmantel, flexibel"
  "Encapsulation: parts are embedded in a compound": "Vergusskapselung: Teile sind in eine Vergussmasse eingebettet"
  Equipment category: Gerätekategorie
  Ex eb: Ex eb
  Ex ec: Ex ec
  Ex ia: Ex ia
  Ex ib: Ex ib
  Ex ic: Ex ic
  Ex op: Ex op
  Explosive atmosphere: Explosionsfähige Atmosphäre
  "Fixed installation indoors, outdoors, in the ground and in water": "Feste Verlegung innen, im Freien, im Erdreich und im Wasser"
  "Fixed installation on, in and under plaster, in dry, damp and wet rooms": "Feste Verlegung auf, im und unter Putz, in trockenen, feuchten und nassen Räumen"
  "Fixed installation where people and property need protecting in a fire": "Feste Verlegung, wo Menschen und Sachwerte im Brandfall zu schützen sind"
  "Flameproof enclosure: withstands an explosion inside and keeps it from passing out": "Druckfeste Kapselung: hält einer Explosion im Inneren stand und lässt sie nicht nach außen dringen"
  "Harmonised types begin with H: 05 stands for 300/500 V, 07 for 450/750 V; then the insulation and the sheath, V PVC, R rubber, N polychloroprene, B EPR, Q polyurethane, S silicone; at the end the conductor, U solid, R stranded, K fine-stranded for fixed installation, F fine-stranded and flexible. National types begin with N: -J has a green-yellow protective conductor, -O has none.": "Harmonisierte Typen beginnen mit H: 05 steht für 300/500 V, 07 für 450/750 V; dann folgen Isolierung und Mantel, V PVC, R Gummi, N Polychloropren, B EPR, Q Polyurethan, S Silikon; am Ende der Leiter, U eindrähtig, R mehrdrähtig, K feindrähtig für feste Verlegung, F feindrähtig und flexibel. Nationale Typen beginnen mit N: -J hat einen grün-gelben Schutzleiter, -O keinen."
  "Heat-resistant wiring of lamps, heaters and switchboards": "Wärmebeständige Verdrahtung von Leuchten, Heizgeräten und Schaltanlagen"
  "High stress, in wet rooms and outdoors, on building sites and in agriculture": "Hohe Beanspruchung, in nassen Räumen und im Freien, auf Baustellen und in der Landwirtschaft"
  "How often an explosive atmosphere occurs: zones 0, 1, 2 for gas and vapour, 20, 21, 22 for dust. Equipment of a higher category may serve in a zone of lower risk.": "Wie oft eine explosionsfähige Atmosphäre auftritt: Zonen 0, 1, 2 für Gas und Dampf, 20, 21, 22 für Staub. Betriebsmittel einer höheren Kategorie dürfen in einer Zone geringerer Gefahr dienen."
  "How the equipment keeps from igniting an explosive atmosphere. The nameplate also carries the number of the certificate, such as PTB 17 ATEX 2010 X: the notified body, the year of issue, the directive and a number; X calls for special conditions of safe use, U marks a component that is assessed again once built in.": "Wie das Betriebsmittel verhindert, eine explosionsfähige Atmosphäre zu zünden. Das Typschild trägt dazu die Nummer der Bescheinigung, etwa PTB 17 ATEX 2010 X: die benannte Stelle, das Ausstellungsjahr, die Richtlinie und eine Nummer; X verlangt besondere Bedingungen für den sicheren Einsatz, U kennzeichnet ein Bauteil, das nach dem Einbau erneut bewertet wird."
  "In conduits and closed ducts, wiring of switchgear and equipment": "In Rohren und geschlossenen Kanälen, Verdrahtung von Schaltanlagen und Geräten"
  "In conduits and closed ducts, wiring of switchgear, distribution boards and machines": "In Rohren und geschlossenen Kanälen, Verdrahtung von Schaltanlagen, Verteilern und Maschinen"
  "In the ground, in water, outdoors and indoors; the concentric conductor serves as PE, PEN or screen": "Im Erdreich, im Wasser, im Freien und innen; der konzentrische Leiter dient als PE, PEN oder Schirm"
  "Increased safety: further measures keep sparks, arcs and hot surfaces away": "Erhöhte Sicherheit: zusätzliche Maßnahmen verhindern Funken, Lichtbögen und heiße Oberflächen"
  "Intrinsic safety: the energy is too small for sparks or heating to ignite": "Eigensicherheit: Die Energie ist zu klein, als dass Funken oder Erwärmung zünden könnten"
