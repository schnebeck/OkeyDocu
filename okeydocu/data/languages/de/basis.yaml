# OkeyDocu - German texts of what a measuring function rests on (data/basis.yaml).
texts:
  The supply has to match what the machine is built for. A voltage between N and PE that stands out points to load on N or a fault in the PEN.: >-
    Die Versorgung muss zu dem passen, wofür die Maschine gebaut ist. Eine auffällige
    Spannung zwischen N und PE deutet auf Last auf dem N oder einen Fehler im PEN hin.
  Measure each further supply the same way. For a machine with a plug, measure at the socket outlet that feeds it.: >-
    Jede weitere Einspeisung genauso messen. Bei einer Maschine mit Stecker an der
    Steckdose messen, die sie versorgt.
  A wrong phase sequence turns motors the wrong way. The instrument only shows a valid sequence when all three line conductors are there and none lies on N or PE.: >-
    Ein falsches Drehfeld lässt Motoren falsch herum laufen. Das Gerät zeigt nur dann ein
    gültiges Drehfeld, wenn alle drei Außenleiter da sind und keiner auf N oder PE liegt.
  Check every three-phase supply and socket outlet the machine is fed from.: >-
    Jede Drehstrom-Einspeisung und -Steckdose prüfen, aus der die Maschine versorgt wird.
  "Test 1 of EN 60204-1 and the first of all measurements: a fault current can only disconnect through an intact protective conductor, and every later measurement under voltage relies on it. The standard sets no fixed limit; the reading has to fit the length, cross-section and material of the conductors.": >-
    Prüfung 1 der EN 60204-1 und die erste aller Messungen: Ein Fehlerstrom kann nur über
    einen intakten Schutzleiter abschalten, und jede spätere Messung unter Spannung verlässt
    sich darauf. Die Norm nennt keinen festen Grenzwert; der Messwert muss zu Länge,
    Querschnitt und Werkstoff der Leiter passen.
  "Measure from the same reference to every exposed conductive part: housings, motors, doors and covers that carry equipment, frame parts. Book each reading to the element it was taken at.": >-
    Vom selben Bezugspunkt zu jedem Körper messen: Gehäuse, Motoren, Türen und Deckel mit
    Betriebsmitteln, Gestellteile. Jeden Messwert auf das Element buchen, an dem er
    entstanden ist.
  "EN 60204-1 asks for 0.2 A up to about 10 A; 25 A is the instrument maker's choice. It finds poor joints in large cross-sections and switchgear assemblies, while thin conductors of an installation may warm up. Test 1 is met with 0.2 A already.": >-
    EN 60204-1 verlangt 0,2 A bis etwa 10 A; 25 A sind eine Wahl des Geräteherstellers.
    Damit fallen schlechte Verbindungen bei großen Querschnitten und in
    Schaltgerätekombinationen auf, während dünne Leiter einer Installation warm werden
    können. Prüfung 1 ist schon mit 0,2 A erfüllt.
  Use it where large cross-sections or busbars are to be judged; measure the other parts with 0.2 A.: >-
    Dort einsetzen, wo große Querschnitte oder Sammelschienen zu beurteilen sind; die
    übrigen Teile mit 0,2 A messen.
  "Damaged insulation lets a fault current flow before anybody touches the machine. EN 60204-1 measures the conductors of the power circuits against the protective conductor with 500 V DC and asks for at least 1 MΩ; joined active conductors against PE is the measurement it means, single pairs Lx-PE and N-PE are equivalent and narrow a fault down.": >-
    Eine beschädigte Isolation lässt einen Fehlerstrom fließen, bevor jemand die Maschine
    berührt. EN 60204-1 misst die Leiter der Hauptstromkreise gegen den Schutzleiter mit
    500 V DC und verlangt mindestens 1 MΩ; gemeint ist die Messung der verbundenen aktiven
    Leiter gegen PE, Einzelpaare Lx-PE und N-PE sind gleichwertig und grenzen einen Fehler
    ein.
  "Measure the sections behind open contactors separately. L-N and L-L only with all loads disconnected. Where surge protection stays connected, a lower test voltage must not fall below the peak of the supply voltage, about 360 V for a machine at 230 V.": >-
    Abschnitte hinter offenen Schützen getrennt messen. L-N und L-L nur bei abgetrennten
    Verbrauchern. Bleibt ein Überspannungsschutz angeschlossen, darf eine gesenkte
    Prüfspannung den Scheitelwert der Versorgungsspannung nicht unterschreiten, bei einer
    Maschine an 230 V etwa 360 V.
  "No standard asks for a rising test voltage. It finds the voltage at which surge protection or a spark gap begins to conduct, and so shows how far the test voltage of the insulation measurement may be lowered while that protection stays connected.": >-
    Keine Norm verlangt eine steigende Prüfspannung. Sie findet die Spannung, bei der ein
    Überspannungsschutz oder eine Funkenstrecke zu leiten beginnt, und zeigt so, wie weit die
    Prüfspannung der Isolationsmessung gesenkt werden darf, solange dieser Schutz
    angeschlossen bleibt.
  Repeat it at every surge protective device that cannot be disconnected.: >-
    An jedem Überspannungsschutz wiederholen, der sich nicht abklemmen lässt.
  "Proves that the RCD disconnects in time: under 300 ms at IΔN for a general type, 130 to 500 ms for a selective one. Before tripping, the instrument measures the touch voltage at a small current and stops where it would exceed the limit.": >-
    Weist nach, dass der FI rechtzeitig abschaltet: unter 300 ms bei IΔN für die allgemeine
    Bauart, 130 bis 500 ms für einen selektiven. Vor dem Auslösen misst das Gerät die
    Berührungsspannung mit kleinem Strom und bricht ab, wo sie den Grenzwert überschreiten
    würde.
  "The touch voltage tells most at the far end of the protected circuit, with PE taken there: measure it again at the socket outlet or the load. Readings of another RCD go to its own element.": >-
    Die Berührungsspannung sagt am entferntesten Punkt des geschützten Stromkreises am
    meisten, mit PE von dort: an der Steckdose oder am Verbraucher noch einmal messen.
    Messwerte eines anderen FI gehören auf dessen eigenes Element.
  "A rising current finds where the RCD trips; for sinusoidal current it has to lie between half and the full rated residual current. A leakage current of the running machine adds to the test current and makes the RCD seem more sensitive than it is.": >-
    Ein steigender Strom findet, wo der FI auslöst; bei sinusförmigem Strom muss das zwischen
    dem halben und dem vollen Bemessungsdifferenzstrom liegen. Ein Ableitstrom der laufenden
    Maschine addiert sich zum Prüfstrom und lässt den FI empfindlicher erscheinen, als er ist.
  Switch the loads off or measure their leakage current with the clamp beforehand and note it. Readings of another RCD go to its own element.: >-
    Verbraucher abschalten oder ihren Ableitstrom vorher mit der Zange messen und vermerken.
    Messwerte eines anderen FI gehören auf dessen eigenes Element.
  "Tripping current and time in one run: the current rises until the RCD trips, and the time at that current is taken with it.": >-
    Auslösestrom und -zeit in einem Durchgang: Der Strom steigt, bis der FI auslöst, und die
    Zeit bei diesem Strom wird mitgemessen.
  Switch the loads off beforehand, their leakage current adds to the test current. Readings of another RCD go to its own element.: >-
    Verbraucher vorher abschalten, ihr Ableitstrom addiert sich zum Prüfstrom. Messwerte
    eines anderen FI gehören auf dessen eigenes Element.
  "Test 2 of EN 60204-1: a fault between a line conductor and PE must make the protective device disconnect in time. The loop impedance measured cold may be at most 2/3 of U₀/Iₐ, the third left for the warm conductors. Take Test 1 first: a broken protective conductor would put the voltage on the housing while measuring.": >-
    Prüfung 2 der EN 60204-1: Ein Fehler zwischen Außenleiter und PE muss das Schutzorgan
    rechtzeitig abschalten lassen. Die kalt gemessene Schleifenimpedanz darf höchstens 2/3
    von U₀/Iₐ betragen, das letzte Drittel bleibt für die warmen Leiter. Prüfung 1 vorher:
    Ein unterbrochener Schutzleiter legte beim Messen die Spannung auf das Gehäuse.
  "At the incoming terminals the reading gives the impedance of the supply. Then measure at the far end of every circuit with a protective device of its own, at the motor terminals, the socket outlet or the input of the drive, with probe PE on the PE there: on the PE bar the protective conductor of the circuit would be missing from the loop and the impedance would seem too small. Each line conductor against PE.": >-
    An den Eingangsklemmen ergibt der Messwert die Impedanz der Versorgung. Danach am Ende
    jedes Stromkreises mit eigenem Schutzorgan messen, an den Motorklemmen, der Steckdose
    oder dem Eingang des Antriebs, mit der Spitze PE am PE dort: An der PE-Schiene fehlte der
    Schutzleiter des Stromkreises in der Schleife, und die Impedanz erschiene zu klein. Jeden
    Außenleiter gegen PE.
  "The protective device behind an RCD has to be judged too. A direct current blinds an RCD of type A or F before the measurement, so it does not trip. It does not work behind a type B, and some type A trip nonetheless: there L-N and N-PE is the safer way.": >-
    Auch das Schutzorgan hinter einem FI ist zu beurteilen. Ein Gleichstrom macht einen FI
    vom Typ A oder F vor der Messung blind, sodass er nicht auslöst. Hinter einem Typ B geht
    das nicht, und manche Typ A lösen trotzdem aus: Dort ist L-N und N-PE der sicherere Weg.
  Measure at the far end of each circuit behind the RCD, with probe PE on the PE there.: >-
    Am Ende jedes Stromkreises hinter dem FI messen, mit der Spitze PE am PE dort.
  "Behind an RCD of type A, F or B: the loop is put together from L-N with the full test current and N-PE with a current the RCD does not trip at. It needs N at the test point and measures from 0.5 Ω up.": >-
    Hinter einem FI vom Typ A, F oder B: Die Schleife setzt sich aus L-N mit vollem Prüfstrom
    und N-PE mit einem Strom zusammen, bei dem der FI nicht auslöst. Dafür muss N an der
    Prüfstelle sein; gemessen wird ab 0,5 Ω.
  "Measure at the far end of each circuit behind the RCD, with the probes on N and PE there, changed over as before. Where the limit of the protective device lies below 0.5 Ω, measure in front of the RCD with the full current and add the protective conductor resistance behind it.": >-
    Am Ende jedes Stromkreises hinter dem FI messen, mit den Spitzen an N und PE dort,
    vertauscht wie zuvor. Liegt der Grenzwert des Schutzorgans unter 0,5 Ω, vor dem FI mit
    vollem Strom messen und den Schutzleiterwiderstand dahinter addieren.
  "A test current of half the rated residual current does not trip the RCD, but it is read only from 10 Ω up: too coarse to judge a circuit breaker. It shows that the RCD itself disconnects, which holds where the loop stays below U_L / IΔN, 1666 Ω at 30 mA.": >-
    Ein Prüfstrom vom halben Bemessungsdifferenzstrom löst den FI nicht aus, wird aber erst
    ab 10 Ω abgelesen: zu grob, um einen Leitungsschutzschalter zu beurteilen. Er zeigt, dass
    der FI selbst abschaltet; das gilt, solange die Schleife unter U_L / IΔN bleibt, 1666 Ω
    bei 30 mA.
  To judge the circuit breaker take L-N and N-PE instead, or measure in front of the RCD with the full current.: >-
    Für den Leitungsschutzschalter stattdessen L-N und N-PE nehmen oder vor dem FI mit vollem
    Strom messen.
  "Capacitors in drives and power supplies keep their charge after switching off. Live parts must fall to 60 V within 5 s; exposed pins of a pulled plug within 1 s, or they need a cover or a warning.": >-
    Kondensatoren in Antrieben und Netzteilen halten ihre Ladung nach dem Abschalten. Aktive
    Teile müssen innerhalb von 5 s auf 60 V fallen, freiliegende Stifte eines gezogenen
    Steckers innerhalb von 1 s, sonst brauchen sie eine Abdeckung oder einen Warnhinweis.
  "Measure between the line conductors too, L1-L2, L2-L3, L3-L1, and at accessible DC link terminals. The moment of switching off is random: measure at least three times and keep the highest reading.": >-
    Auch zwischen den Außenleitern messen, L1-L2, L2-L3, L3-L1, und an zugänglichen
    Zwischenkreisklemmen. Der Abschaltaugenblick ist zufällig: mindestens dreimal messen und
    den höchsten Wert behalten.
  "In an IT system the first fault does not disconnect: the insulation monitor has to report it. A test resistance of half the set response value, switched between a line conductor and PE, must raise the alarm.": >-
    Im IT-System schaltet der erste Fehler nicht ab: Der Isolationswächter muss ihn melden.
    Ein Prüfwiderstand vom halben eingestellten Ansprechwert zwischen einem Außenleiter und
    PE muss den Alarm auslösen.
  "Test each line conductor of the IT system. Then the test button of the monitor, the monitoring of its own connections, and whether the alarm reaches the place where someone sees it. Disconnect the monitor before measuring the insulation.": >-
    Jeden Außenleiter des IT-Systems prüfen. Dann die Prüftaste des Wächters, die
    Überwachung seiner eigenen Anschlüsse und ob der Alarm dort ankommt, wo ihn jemand sieht.
    Vor der Isolationsmessung den Wächter abklemmen.
  "A residual current monitor reports a rising leakage before it becomes a fault. At half the rated residual current it must stay silent for at least 10 s, at the full one it must report within 10 s.": >-
    Ein Differenzstrom-Überwachungsgerät meldet einen steigenden Ableitstrom, bevor ein
    Fehler daraus wird. Beim halben Bemessungsdifferenzstrom muss es mindestens 10 s
    schweigen, beim vollen innerhalb von 10 s melden.
  "Measure the leakage current of the running machine with the clamp first: the alarm needs room above it. A monitor that switches a contactor off is tested like an RCD.": >-
    Zuerst den Ableitstrom der laufenden Maschine mit der Zange messen: Der Alarm braucht
    Abstand darüber. Ein Überwachungsgerät, das ein Schütz abschaltet, wird wie ein FI
    geprüft.
  Parts not connected to PE must not carry a dangerous current when touched. The guide value for the touch current is 0.5 mA, measured with the machine running.: >-
    Teile ohne PE-Verbindung dürfen beim Berühren keinen gefährlichen Strom führen. Der
    Richtwert für den Berührungsstrom ist 0,5 mA, gemessen bei laufender Maschine.
  Measure every touchable part in every mode of operation. A machine with a Schuko plug in both directions of the plug, keeping the higher reading.: >-
    Jedes berührbare Teil in jeder Betriebsart messen. Eine Maschine mit Schukostecker in
    beiden Steckrichtungen, der höhere Wert gilt.
  "Above 10 mA in the protective conductor EN 60204-1 asks for a further measure, such as 10 mm² Cu, a second protective conductor or a CEE plug with 2.5 mm² PE; a Schuko plug is not one of them. Around PE alone the clamp shows the protective conductor current, around all active conductors without PE the residual current.": >-
    Über 10 mA im Schutzleiter verlangt EN 60204-1 eine weitere Maßnahme, etwa 10 mm² Cu,
    einen zweiten Schutzleiter oder einen CEE-Stecker mit 2,5 mm² PE; ein Schukostecker
    gehört nicht dazu. Um den PE allein zeigt die Zange den Schutzleiterstrom, um alle
    aktiven Leiter ohne PE den Differenzstrom.
  "Measure in every mode of operation, with the drives enabled. The small clamp ends at 9.99 mA: above about 8 mA or on overflow take a clamp with a larger range.": >-
    In jeder Betriebsart messen, mit freigegebenen Antrieben. Die kleine Zange endet bei
    9,99 mA: über etwa 8 mA oder bei Überlauf eine Zange mit größerem Bereich nehmen.
  "Too much voltage drop makes motors draw more current and contactors drop out. The installation up to the machine is judged against 4 % from the handover point; inside the machine EN 60204-1 allows 5 %, a design value proven by the documents.": >-
    Zu viel Spannungsfall lässt Motoren mehr Strom ziehen und Schütze abfallen. Die
    Installation bis zur Maschine wird gegen 4 % ab der Übergabestelle beurteilt; innerhalb
    der Maschine erlaubt EN 60204-1 5 %, ein Konstruktionswert, den die Unterlagen belegen.
  "With a symmetric three-phase load Z L-N overstates the drop; where the lines are short and thick the difference lies within the measuring error, and calculating is better.": >-
    Bei symmetrischer Drehstromlast überschätzt Z L-N den Spannungsfall; bei kurzen, dicken
    Leitungen liegt der Unterschied in der Messabweichung, dann ist Rechnen besser.
