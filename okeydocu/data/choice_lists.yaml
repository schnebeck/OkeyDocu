# OkeyDocu - okeydocu/data/choice_lists.yaml
# The choice lists a new database starts with. All of it can be changed under Settings →
# Choice lists.
#
# lists:      by key; a feature of data/kinds.yaml names the list it offers
#   label:      name of the list
#   help:       what the list is about
#   attributes: the columns of the list, in the order told
#   values:     a plain list, or by value with
#     facts:      text by attribute; the tooltip tells those in which the values differ
#     help:       what to know about the value
#     curve:      time-current characteristic: "breaker <lower> <upper> [<no trip> <trip>]",
#                 instantaneous trip range and conventional currents in multiples of Iₙ
#                 (1.13 and 1.45 where left out, as for circuit breakers to EN 60898-1)
#     methods:    measuring functions of the vocabulary suited to it, each with a note
#
# breaker_values and fuse_methods are shared parts, taken up by the lists below.
#
# Producer: thorsten.schnebeck@gmx.net
# Generator: Claude Opus 5.5
# SPDX-FileCopyrightText: (C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>
# SPDX-License-Identifier: GPL-3.0-or-later

breaker_values: &breakers
  B:
    facts: {Protective device: Circuit breaker, Instantaneous trip: "3 to 5 × Iₙ",
            Disconnecting current Iₐ: "5 × Iₙ", Disconnection time: under 0.1 s,
            Use: Socket and lighting circuits}
    curve: breaker 3 5
    help: >-
      In Germany the usual choice for socket and lighting circuits in homes. With Iₐ = 5 × Iₙ a B16
      disconnects at 80 A; at U₀ 230 V the loop impedance may then be at most
      230 V / 80 A = 2.88 Ω.
    methods: &breaker_methods
      - {function: zloop, note: "Limit Zs ≤ U₀ / Iₐ, set on the instrument by characteristic and rated current"}
      - {function: zloop_dc, note: "Where an RCD of type AC or A protects the circuit too: does not trip it"}
      - {function: zln_du, note: Short-circuit current between the lines and voltage drop}
  C:
    facts: {Protective device: Circuit breaker, Instantaneous trip: "5 to 10 × Iₙ",
            Disconnecting current Iₐ: "10 × Iₙ", Disconnection time: under 0.1 s,
            Use: "Loads with inrush currents, such as motors"}
    curve: breaker 5 10
    help: >-
      For loads that draw a high current on switching on, such as motors and lamp groups. With Iₐ = 10 × Iₙ a C16 needs 160 A, so the loop impedance may be at most
      1.44 Ω at U₀ 230 V.
    methods: *breaker_methods
  D:
    facts: {Protective device: Circuit breaker, Instantaneous trip: "10 to 20 × Iₙ",
            Disconnecting current Iₐ: "20 × Iₙ", Disconnection time: under 0.1 s,
            Use: "Loads with high inrush currents, such as transformers"}
    curve: breaker 10 20
    help: >-
      For high inrush currents, such as transformers. With Iₐ = 20 × Iₙ a D16 needs 320 A, so the loop impedance may be at most 0.72 Ω at U₀ 230 V.
    methods: *breaker_methods
  K:
    facts: {Protective device: Circuit breaker, Instantaneous trip: "8 to 12 × Iₙ, by maker up to 14 × Iₙ",
            Disconnecting current Iₐ: "12 × Iₙ", Disconnection time: under 0.2 s,
            Use: "Motors and transformers, with a closely set overload release"}
    curve: breaker 8 12 1.05 1.2
    help: >-
      For motors and transformers: rides through inrush currents, while its overload release is
      set closely to the rated current (IEC 60947-2). The PROFITEST takes Iₐ = 12 × Iₙ: a K16
      needs 192 A, so the loop impedance may be at most 1.20 Ω at U₀ 230 V. Some makers give
      up to 14 × Iₙ; their data sheet then sets Iₐ.
    methods: *breaker_methods
  Z:
    facts: {Protective device: Circuit breaker, Instantaneous trip: "2 to 3 × Iₙ",
            Disconnecting current Iₐ: "3 × Iₙ", Disconnection time: under 0.2 s,
            Use: Semiconductors and measuring circuits}
    curve: breaker 2 3 1.05 1.2
    help: >-
      For semiconductors, control and measuring circuits: trips at a low fault current already.
      With Iₐ = 3 × Iₙ a Z16 needs 48 A, so the loop impedance may
      be at most 4.79 Ω at U₀ 230 V.
    methods: *breaker_methods

fuse_methods: &fuse_methods
  - {function: zloop, note: "Limit Zs ≤ U₀ / Iₐ, Iₐ from the fuse curve at the disconnection time"}
  - {function: zln_du, note: Short-circuit current between the lines and voltage drop}

lists:
  cable_type:
    label: Cable type
    help: >-
      Harmonised types begin with H: 05 stands for 300/500 V, 07 for 450/750 V; then the
      insulation and the sheath, V PVC, R rubber, N polychloroprene, B EPR, Q polyurethane, S
      silicone; at the end the conductor, U solid, R stranded, K fine-stranded for fixed
      installation, F fine-stranded and flexible. National types begin with N: -J has a
      green-yellow protective conductor, -O has none.
    attributes: [Construction, Protective conductor, Rated voltage, Use]
    values:
      NYM-J: {facts: {<<: &nym {Construction: "PVC insulation and sheath, solid", Rated voltage: 300/500 V,
                           Use: "Fixed installation on, in and under plaster, in dry, damp and wet rooms"},
                      Protective conductor: green-yellow core}}
      NYM-O: {facts: {<<: *nym, Protective conductor: none}}
      NYY-J: {facts: {<<: &nyy {Construction: "PVC insulation and sheath, solid or stranded", Rated voltage: 0.6/1 kV,
                           Use: "Fixed installation indoors, outdoors, in the ground and in water"},
                      Protective conductor: green-yellow core}}
      NYY-O: {facts: {<<: *nyy, Protective conductor: none}}
      NYCWY: {facts: {Construction: "PVC insulation and sheath, with a concentric copper conductor",
                      Protective conductor: the concentric conductor,
                      Rated voltage: 0.6/1 kV,
                      Use: "In the ground, in water, outdoors and indoors; the concentric conductor serves as PE, PEN or screen"}}
      N2XH-J: {facts: {Construction: "XLPE insulation, halogen-free sheath", Rated voltage: 0.6/1 kV,
                       Protective conductor: green-yellow core,
                       Use: "Fixed installation where people and property need protecting in a fire"}}
      NYIF-J: {facts: {Construction: "PVC cores in a rubber sheath, flat, solid", Rated voltage: 230/400 V,
                       Protective conductor: green-yellow core,
                       Use: "Only in and under plaster in dry rooms"}}
      H07V-U: {facts: {Construction: "PVC single core, solid", Rated voltage: 450/750 V,
                       Use: "In conduits and closed ducts, wiring of switchgear and equipment"}}
      H07V-R: {facts: {Construction: "PVC single core, stranded", Rated voltage: 450/750 V,
                       Use: "In conduits and closed ducts, wiring of switchgear and equipment"}}
      H07V-K: {facts: {Construction: "PVC single core, fine-stranded", Rated voltage: 450/750 V,
                       Use: "In conduits and closed ducts, wiring of switchgear, distribution boards and machines"}}
      H05VV-F: {facts: {Construction: "PVC insulation and sheath, flexible", Rated voltage: 300/500 V,
                        Use: "Connecting household appliances and power tools at medium stress, not outdoors for good"}}
      H07RN-F: {facts: {Construction: "Rubber insulation, polychloroprene sheath, flexible", Rated voltage: 450/750 V,
                        Use: "High stress, in wet rooms and outdoors, on building sites and in agriculture"}}
      H07BQ-F: {facts: {Construction: "EPR insulation, polyurethane sheath, flexible", Rated voltage: 450/750 V,
                        Use: "Tools on building sites and in workshops; resists oil and abrasion"}}
      H05RR-F: {facts: {Construction: "Rubber insulation and sheath, flexible", Rated voltage: 300/500 V,
                        Use: "Light hand-held appliances at light to medium stress, in dry and damp rooms"}}
      H05SJ-K: {facts: {Construction: "Silicone single core with glass-fibre braid, fine-stranded", Rated voltage: 300/500 V,
                        Use: "Heat-resistant wiring of lamps, heaters and switchboards"}}

  characteristic:
    label: Characteristic
    help: >-
      How fast the protective device of the circuit disconnects at which current. For the loop
      impedance it gives the disconnecting current Iₐ: the fault current at which the device
      disconnects within the required time. The loop impedance may be at most U₀ / Iₐ. The
      measured value is commonly held to two thirds of it (DIN VDE 0100-600, informative
      annex), as the conductors warm up in a fault and the measurement has its error.
    attributes: [Protective device, Instantaneous trip, Disconnecting current Iₐ,
                 Disconnection time, Required for, Use]
    values:
      <<: *breakers
      A:
        facts: {Protective device: "Circuit breaker, older or maker-specific",
                Instantaneous trip: "2 to 3 × Iₙ", Disconnecting current Iₐ: "3 × Iₙ",
                Use: Semiconductors}
        help: >-
          A characteristic of Siemens, not in a standard, for the protection of semiconductors.
        methods: *breaker_methods
      E:
        facts: {Protective device: Selective main circuit breaker (SLS),
                Instantaneous trip: "5 to 6.25 × Iₙ, delayed", Disconnecting current Iₐ: "5 × Iₙ",
                Use: Main circuits}
        help: >-
          Selective main circuit breaker: its short-circuit release trips with a delay, so the
          circuit breakers behind it disconnect first. The PROFITEST takes Iₐ = 5 × Iₙ.
        methods: *breaker_methods
      G:
        facts: {Protective device: "Circuit breaker, older or maker-specific",
                Disconnecting current Iₐ: "10 × Iₙ", Use: "Older installations, today C"}
        help: >-
          Old characteristic for the protection of devices, replaced by C; the PROFITEST takes it
          as C with Iₐ = 10 × Iₙ.
        methods: *breaker_methods
      L:
        facts: {Protective device: "Circuit breaker, older or maker-specific",
                Disconnecting current Iₐ: "5 × Iₙ", Use: "Older installations, today B"}
        help: >-
          Old characteristic for the protection of lines, made until about 1990 and replaced by
          B; the PROFITEST takes it as B with Iₐ = 5 × Iₙ.
        methods: *breaker_methods
      gG:
        facts: {Protective device: "Fuse, full range", Use: "Cables and lines, overload and short circuit"}
        help: >-
          Full-range fuse for cables and lines, against overload and short circuit; gL is the
          older German name. Without a disconnection time the limit of the loop impedance is
          open: one of the entries gL/gG with a time sets it.
        methods: *fuse_methods
      gL/gG <0.2s:
        facts: {Protective device: "Fuse, full range",
                Disconnecting current Iₐ: from the fuse curve at 0.2 s,
                Disconnection time: at most 0.2 s,
                Required for: "Final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A: TT system at U₀ 230 V, TN system at U₀ 400 V",
                Use: "Cables and lines, overload and short circuit"}
        help: >-
          Full-range fuse, judged by the disconnection time required for final circuits with
          socket-outlets up to 63 A or fixed equipment up to 32 A in a TT system at U₀ 230 V or a
          TN system at U₀ 400 V. Iₐ is the current that
          melts the fuse within 0.2 s; it comes from the time-current characteristic of the fuse
          at its rated current.
        methods: *fuse_methods
      gL/gG <0.4s:
        facts: {Protective device: "Fuse, full range",
                Disconnecting current Iₐ: from the fuse curve at 0.4 s,
                Disconnection time: at most 0.4 s,
                Required for: "Final circuits with socket-outlets up to 63 A or fixed equipment up to 32 A: TN system at U₀ 230 V",
                Use: "Cables and lines, overload and short circuit"}
        help: >-
          Full-range fuse, judged by the disconnection time required for final circuits with
          socket-outlets up to 63 A or fixed equipment up to 32 A in a TN system at U₀ 230 V, the
          most common case. Iₐ is the current that melts
          the fuse within 0.4 s; it comes from the time-current characteristic of the fuse at
          its rated current.
        methods: *fuse_methods
      gL/gG <1s:
        facts: {Protective device: "Fuse, full range",
                Disconnecting current Iₐ: from the fuse curve at 1 s,
                Disconnection time: at most 1 s,
                Required for: "Distribution circuits and other final circuits: TT system",
                Use: "Cables and lines, overload and short circuit"}
        help: >-
          Full-range fuse, judged by the disconnection time allowed in a TT system for
          distribution circuits and final circuits beyond those of 0.2 s. Iₐ is the current that melts the
          fuse within 1 s.
        methods: *fuse_methods
      gL/gG <5s:
        facts: {Protective device: "Fuse, full range",
                Disconnecting current Iₐ: from the fuse curve at 5 s,
                Disconnection time: at most 5 s,
                Required for: "Distribution circuits and other final circuits: TN system",
                Use: "Cables and lines, overload and short circuit"}
        help: >-
          Full-range fuse, judged by the disconnection time allowed in a TN system for
          distribution circuits and final circuits beyond those of 0.4 s. Iₐ is the current that melts the
          fuse within 5 s.
        methods: *fuse_methods
      aM:
        facts: {Protective device: "Fuse, partial range",
                Use: "Motors, short circuit only; overload needs a device of its own"}
        help: >-
          Partial-range fuse for motors: it breaks short circuits only, a motor protection relay
          has to guard against overload. Iₐ comes from the manufacturer's characteristic.
        methods: *fuse_methods

  breaker_characteristic:
    label: Circuit breaker characteristic
    help: >-
      Characteristic of the circuit breaker, also of the breaker part of an RCBO. It gives the
      disconnecting current Iₐ for the loop impedance.
    attributes: [Protective device, Instantaneous trip, Disconnecting current Iₐ,
                 Disconnection time, Required for, Use]
    values: *breakers

  rcd_characteristic:
    label: RCD characteristic
    help: >-
      Whether and how long the RCD delays its tripping. A selective RCD upstream lets the RCD
      of the final circuit trip first.
    attributes: [Delay, Break time at IΔn, Use]
    values:
      general:
        facts: {Delay: none, Break time at IΔn: at most 300 ms, Use: Final circuits}
        methods:
          - {function: rcd_time, note: "At most 300 ms at IΔn, 150 ms at 2 × IΔn, 40 ms at 5 × IΔn"}
      selective (S):
        facts: {Delay: "yes, for selectivity", Break time at IΔn: 130 to 500 ms,
                Use: Upstream of further RCDs}
        methods:
          - {function: rcd_time, note: "130 to 500 ms at IΔn, 60 to 200 ms at 2 × IΔn, 50 to 150 ms at 5 × IΔn"}
      short-time delayed (G):
        facts: {Delay: at least 10 ms, Break time at IΔn: 10 to 300 ms,
                Use: Loads with short surges of leakage current}
        methods:
          - {function: rcd_time, note: "10 to 300 ms at IΔn"}

  rcd_type:
    label: RCD type
    help: >-
      Which forms of residual current the RCD detects. Electronics in a load, such as a
      frequency converter, can cause residual currents a type AC or A does not detect; smooth
      DC residual currents can even blind it to those it would detect. The type sets the test
      currents of the RCD test.
    attributes: [Detects, Frequencies]
    values:
      AC:
        facts: {Detects: sinusoidal AC residual currents, Frequencies: 50 Hz}
        help: >-
          Detects sinusoidal residual currents only. Residual currents of electronic loads pass
          it unseen.
        methods:
          - {function: rcd_current, note: "Trips between 0.5 and 1 × IΔn"}
          - {function: zloop_dc, note: The DC pre-magnetisation keeps it from tripping}
      A:
        facts: {Detects: "as AC, and pulsating DC residual currents", Frequencies: 50 Hz}
        help: >-
          The usual type for final circuits: detects sinusoidal and pulsating DC residual
          currents. A smooth DC residual current above 6 mA can blind it.
        methods:
          - {function: rcd_current, note: "Sinusoidal: trips between 0.5 and 1 × IΔn; pulsating DC: between 0.35 and 1.4 × IΔn above 10 mA"}
          - {function: zloop_dc, note: The DC pre-magnetisation keeps it from tripping}
      F:
        facts: {Detects: "as A, and residual currents of mixed frequencies", Frequencies: up to 1 kHz}
        help: >-
          For single-phase frequency converters, as in washing machines: also detects residual
          currents of mixed frequencies up to 1 kHz and bears 10 mA of smooth DC.
        methods:
          - {function: rcd_current, note: "Sinusoidal: trips between 0.5 and 1 × IΔn"}
          - {function: zloop_half, note: "Measures with half the rated residual current, 15 mA at 30 mA"}
      B:
        facts: {Detects: "as F, and smooth DC residual currents", Frequencies: up to 1 kHz}
        help: >-
          Sensitive to all currents: also detects smooth DC residual currents, as three-phase
          frequency converters, PV inverters or charging points without a DC detection of their
          own cause them. A DC pre-magnetisation for the loop impedance would trip it.
        methods:
          - {function: rcd_current, note: "Also with smooth DC: trips between 0.5 and 2 × IΔn"}
          - {function: zloop_half, note: "Measures with half the rated residual current, 15 mA at 30 mA"}
      B+:
        facts: {Detects: "as F, and smooth DC residual currents", Frequencies: up to 20 kHz}
        help: >-
          As type B, for residual currents up to 20 kHz, and trips at 420 mA at most over the
          whole range: for preventive fire protection.
        methods:
          - {function: rcd_current, note: "Also with smooth DC: trips between 0.5 and 2 × IΔn"}
          - {function: zloop_half, note: "Measures with half the rated residual current, 15 mA at 30 mA"}

  earthing_system:
    label: Earthing system type
    help: >-
      How the supply and the exposed conductive parts are earthed. It decides how protection by
      disconnection works and so what is measured: the loop impedance in a TN system, the
      earthing resistance together with the RCD in a TT system, the insulation monitoring in an
      IT system.
    attributes: [Star point, Protective conductor]
    values:
      TN-S:
        facts: {Star point: earthed, Protective conductor: N and PE separate throughout}
        methods: &tn_methods
          - {function: zloop, note: The fault current flows back through the protective conductor and disconnects the protective device}
          - {function: rlo, note: Continuity of the protective conductor}
      TN-C:
        facts: {Star point: earthed, Protective conductor: N and PE combined as PEN throughout}
        help: >-
          The PEN carries the operating current and would have to pass through the RCD, so a
          fault current flowing back on it cancels out: an RCD cannot work here and must not be
          used.
        methods: *tn_methods
      TN-C-S:
        facts: {Star point: earthed, Protective conductor: "PEN first, then N and PE separate"}
        help: >-
          Once N and PE are split, they must not be joined again; RCDs work behind the split.
        methods: *tn_methods
      TT:
        facts: {Star point: earthed, Protective conductor: to an earth electrode of the installation}
        help: >-
          The fault current flows back through the earth. A circuit breaker rarely disconnects
          in time, so an RCD protects; it holds where RA × IΔn ≤ 50 V.
        methods:
          - {function: rcd_touch, note: "Touch voltage at IΔn, at most 50 V"}
          - {function: zloop, note: The loop through the earth gives an upper bound of the earthing resistance RA}
      IT:
        facts: {Star point: isolated from earth or earthed through a high impedance,
                Protective conductor: to an earth electrode of the installation}
        help: >-
          A first fault to earth causes only a small current and need not disconnect; an
          insulation monitoring device reports it. A second fault has to disconnect as in a TN
          or TT system.
        methods:
          - {function: imd, note: Response of the insulation monitoring device}
          - {function: riso, note: Insulation resistance of the system}

  protection_class:
    label: Protection class
    help: How a device protects against electric shock where its basic insulation fails.
    attributes: [Protection by]
    values:
      I:
        facts: {Protection by: a connected protective conductor}
        methods:
          - {function: rlo, note: From the plug or terminal to every touchable metal part}
          - {function: riso, note: "Active conductors against the protective conductor, at least 1 MΩ"}
          - {function: il, note: "Protective conductor current, at most 3.5 mA"}
      II:
        facts: {Protection by: double or reinforced insulation}
        methods:
          - {function: riso, note: "Active conductors against touchable conductive parts, at least 2 MΩ"}
          - {function: il, note: "Touch current at touchable conductive parts, at most 0.5 mA"}
      III:
        facts: {Protection by: safety extra-low voltage (SELV)}
        methods:
          - {function: riso, note: "Mains circuit against the SELV circuit, at least 0.25 MΩ"}
          - {function: u, note: The supply is a safety extra-low voltage}

  ip_rating:
    label: IP rating
    help: >-
      First digit: protection against solid objects and touch, second digit: against water. An
      X stands for a digit left open.
    attributes: [Against solid objects, Against water]
    values:
      IP20: {facts: {Against solid objects: over 12.5 mm, Against water: no protection}}
      IP2X: {facts: {Against solid objects: over 12.5 mm, Against water: not stated}}
      IP40: {facts: {Against solid objects: over 1 mm, Against water: no protection}}
      IP44: {facts: {Against solid objects: over 1 mm, Against water: splashing water}}
      IP54: {facts: {Against solid objects: dust-protected, Against water: splashing water}}
      IP55: {facts: {Against solid objects: dust-protected, Against water: water jets}}
      IP65: {facts: {Against solid objects: dust-tight, Against water: water jets}}
      IP66: {facts: {Against solid objects: dust-tight, Against water: powerful water jets}}
      IP67: {facts: {Against solid objects: dust-tight, Against water: temporary immersion}}
      IP68: {facts: {Against solid objects: dust-tight, Against water: continuous immersion}}

  cross_section:
    label: Cross-section
    values: ["0.5", "0.75", "1", "1.5", "2.5", "4", "6", "10", "16", "25", "35", "50", "70", "95",
             "120", "150", "185", "240", "300"]
  rated_current:
    label: Rated current
    values: ["2", "4", "6", "10", "13", "16", "20", "25", "32", "35", "40", "50", "63", "80",
             "100", "125", "160", "200", "250", "315", "400", "630"]
  rated_residual_current:
    label: Rated residual current
    help: >-
      Up to 30 mA an RCD serves as additional protection of persons, up to 300 mA as fire
      protection.
    attributes: [Protects]
    values:
      "10": {facts: {Protects: persons}}
      "30": {facts: {Protects: persons and against fire}}
      "100": {facts: {Protects: against fire}}
      "300": {facts: {Protects: against fire}}
      "500": {}
      "1000": {}
  number_of_poles:
    label: Number of poles
    values: ["1", "2", "3", "4"]
  cores:
    label: Cores of the cable
    values: ["1", "2", "3", "4", "5", "6", "7", "8", "10"]
  phases:
    label: Phases
    values: ["1", "3"]
  n_terminal:
    label: N terminal
    help: Where the RCD has its N terminals, seen from the front.
    values: [right, left]
  conductor_material:
    label: Conductor material
    values: [Cu, Al]
  supply_frequency:
    label: Supply frequency
    values: ["50", "60"]
  ex_zone:
    label: Ex zone
    help: >-
      How often an explosive atmosphere occurs: zones 0, 1, 2 for gas and vapour, 20, 21, 22 for
      dust. Equipment of a higher category may serve in a zone of lower risk.
    attributes: [Explosive atmosphere, Present, Equipment category, Protection level]
    values:
      "0": {facts: {Explosive atmosphere: gas or vapour, Present: "continuously, for long periods or frequently",
                    Equipment category: 1G, Protection level: Ga}}
      "1": {facts: {Explosive atmosphere: gas or vapour, Present: occasionally in normal operation,
                    Equipment category: 2G, Protection level: Gb}}
      "2": {facts: {Explosive atmosphere: gas or vapour, Present: "normally not, if so rarely and briefly",
                    Equipment category: 3G, Protection level: Gc}}
      "20": {facts: {Explosive atmosphere: dust cloud, Present: "continuously, for long periods or frequently",
                     Equipment category: 1D, Protection level: Da}}
      "21": {facts: {Explosive atmosphere: dust cloud, Present: occasionally in normal operation,
                     Equipment category: 2D, Protection level: Db}}
      "22": {facts: {Explosive atmosphere: dust cloud, Present: "normally not, if so briefly",
                     Equipment category: 3D, Protection level: Dc}}

  ignition_protection:
    label: Type of ignition protection
    help: >-
      How the equipment keeps from igniting an explosive atmosphere. The nameplate also carries
      the number of the certificate, such as PTB 17 ATEX 2010 X: the notified body, the year of
      issue, the directive and a number; X calls for special conditions of safe use, U marks a
      component that is assessed again once built in.
    attributes: [Principle, Zones]
    values:
      Ex d: {facts: {Principle: "Flameproof enclosure: withstands an explosion inside and keeps it from passing out"}}
      Ex eb: {facts: {Principle: "Increased safety: further measures keep sparks, arcs and hot surfaces away",
                      Zones: "1, 2"}}
      Ex ec: {facts: {Principle: "Increased safety: further measures keep sparks, arcs and hot surfaces away",
                      Zones: "2"}}
      Ex ia: {facts: {Principle: "Intrinsic safety: the energy is too small for sparks or heating to ignite",
                      Zones: "0, 1, 2 and 20, 21, 22"}}
      Ex ib: {facts: {Principle: "Intrinsic safety: the energy is too small for sparks or heating to ignite",
                      Zones: "1, 2 and 21, 22"}}
      Ex ic: {facts: {Principle: "Intrinsic safety: the energy is too small for sparks or heating to ignite",
                      Zones: "2 and 22"}}
      Ex p: {facts: {Principle: "Pressurisation: overpressure or purging keeps the atmosphere out"}}
      Ex o: {facts: {Principle: "Liquid immersion: ignition sources lie under a protective liquid"}}
      Ex q: {facts: {Principle: "Powder filling: parts are held and surrounded by a filling"}}
      Ex m: {facts: {Principle: "Encapsulation: parts are embedded in a compound"}}
