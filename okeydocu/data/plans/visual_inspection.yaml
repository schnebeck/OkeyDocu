# OkeyDocu - measuring plan, draft.
# The inspection of a low-voltage installation before it is tested and measured: each point a
# question answered yes when in order. The points follow DIN VDE 0100-600:2017-06, 6.4.2
# (IEC 60364-6:2016, 6.4.2); each step names its clause.
key: visual_inspection
title: Visual inspection to DIN VDE 0100-600
released: false
steps:
- key: documentation
  kind: check
  title: Documentation
  question: Are diagrams, warning notices and the other required information available?
  text: "DIN VDE 0100-600, 6.4.2.3 i)"
- key: circuit_labelling
  kind: check
  title: Circuit labelling
  question: Are circuits, protective devices, switches and terminals clearly labelled?
  text: "DIN VDE 0100-600, 6.4.2.3 j)"
- key: n_pe_identification
  kind: check
  title: N and PE identification
  question: Are neutral and protective conductors correctly identified throughout?
  text: "DIN VDE 0100-600, 6.4.2.3 h)"
- key: equipment_conformity
  kind: check
  title: Equipment conformity
  question: Does the fixed equipment comply with its product standards (marking, certification, maker's data)?
  text: DIN VDE 0100-600, 6.4.2.2
- key: no_damage
  kind: check
  title: No visible damage
  question: Is the equipment free of visible damage that impairs safety?
  text: DIN VDE 0100-600, 6.4.2.2
- key: shock_protection
  kind: check
  title: Protection against electric shock
  question: Is the intended protective measure, basic and fault protection, fully implemented?
  text: "DIN VDE 0100-600, 6.4.2.3 a)"
- key: exposed_parts
  kind: check
  title: Exposed parts earthed
  question: Are all exposed-conductive-parts connected to the earthing arrangement?
  text: "DIN VDE 0100-600, 6.4.2.3 o)"
- key: earthing_bonding
  kind: check
  title: Earthing and bonding
  question: Are earthing, protective conductors and protective bonding suitably chosen and connected to the main earthing terminal?
  text: "DIN VDE 0100-600, 6.4.2.3 l)"
- key: conductor_sizing
  kind: check
  title: Conductor sizing
  question: Do cables, lines and busbars suit the current-carrying capacity and the voltage drop?
  text: "DIN VDE 0100-600, 6.4.2.3 c)"
- key: protective_devices
  kind: check
  title: Protective devices
  question: Are protective and monitoring devices correctly chosen, set and coordinated?
  text: "DIN VDE 0100-600, 6.4.2.3 d)"
- key: surge_protection
  kind: check
  title: Surge protection
  question: Are the required surge protective devices suitably selected, located and installed?
  text: "DIN VDE 0100-600, 6.4.2.3 e)"
- key: isolation_switching
  kind: check
  title: Isolation and switching
  question: Are suitable isolating and switching devices present and correctly placed?
  text: "DIN VDE 0100-600, 6.4.2.3 f)"
- key: single_pole
  kind: check
  title: Single-pole devices
  question: Are single-pole switching and protective devices in line conductors only?
  text: "IEC 60364-6:2006, 61.2 h)"
- key: external_influences
  kind: check
  title: External influences
  question: Are equipment and measures suitable for the surroundings and the mechanical stress, such as by their IP rating?
  text: "DIN VDE 0100-600, 6.4.2.3 g)"
- key: fire_protection
  kind: check
  title: Fire barriers
  question: Are fire barriers in place, and is there protection against thermal effects?
  text: "DIN VDE 0100-600, 6.4.2.3 b)"
- key: connections
  kind: check
  title: Connections
  question: Are all cable and conductor terminations properly made and secure?
  text: "DIN VDE 0100-600, 6.4.2.3 k)"
- key: wiring_systems
  kind: check
  title: Wiring systems
  question: Are wiring systems suitably selected, routed and fixed?
  text: "DIN VDE 0100-600, 6.4.2.3 p)"
- key: accessibility
  kind: check
  title: Accessibility
  question: Is the equipment easy to reach for operation, identification and maintenance?
  text: "DIN VDE 0100-600, 6.4.2.3 m)"
- key: emc
  kind: check
  title: EMC measures
  question: Are the planned measures against electromagnetic disturbances implemented?
  text: "DIN VDE 0100-600, 6.4.2.3 n)"
- key: special_locations
  kind: check
  title: Special locations
  question: Are the additional requirements for special installations and locations (part 7) met?
  text: DIN VDE 0100-600, 6.4.2.3
