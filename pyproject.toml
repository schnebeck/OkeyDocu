[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okeydocu"
version = "0.1.0"
description = "Field testing and documentation on the go"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Thorsten Schnebeck", email = "thorsten.schnebeck@gmx.net" }]
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "PyYAML>=6",
    "Jinja2>=3.1",
    "reportlab>=4",
    "Pillow>=10",
    "pyHanko>=0.25",
    "cryptography>=42",
    "secretstorage>=3.5",
    "python-pkcs11>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
okeydocu = "okeydocu.__main__:main"

[tool.setuptools.packages.find]
include = ["okeydocu*"]

[tool.setuptools.package-data]
okeydocu = ["data/**/*.yaml", "data/**/*.svg", "devices/**/*.yaml", "devices/**/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
