# EasyMeasurement - default template for test reports.
#
# A "measurements" block defines its look for each amount of data:
#   none: no measurement   one: exactly one   many: several
# Texts are English and appear in the language of the report.
name: Standard report
blocks:
  - type: letterhead
    title: "Test report"
    lines:
      - "{{ campaign.title }}"
      - "{{ asset.kind_text }}: {{ asset.name }}"
      - "Tested on {{ campaign.started }}"
    client:
      - "{{ customer.name }}"
      - "{{ customer.street }}"
      - "{{ customer.zip }} {{ customer.city }}"
      - "Department: {{ campaign.department }}"
      - "Contact: {{ campaign.contact }}"
      - "Phone: {{ campaign.contact_phone }}"
      - "{{ campaign.contact_email }}"
    contractor:
      - "{{ company.name }}"
      - "{{ company.street }}"
      - "{{ company.zip }} {{ company.city }}"
      - "Cost centre: {{ campaign.cost_center }}"
      - "Inspector: {{ campaign.tester }}"
    qr: true
    logo: true
  - type: fields
    rows:
      - ["{{ asset.kind_text }}", "{{ asset.name }}"]
      - [Identifier, "{{ asset.identifier }}"]
      - [Manufacturer, "{{ asset.manufacturer }}"]
      - [Type, "{{ asset.type }}"]
      - [Serial number, "{{ asset.serial_no }}"]
      - [Remark, "{{ asset.comment }}"]
    features: asset
  - type: fields
    rows:
      - [Test plan, "{{ campaign.plan }}"]
      - [Started, "{{ campaign.started }}"]
      - [Completed, "{{ campaign.closed }}"]
  - type: heading
    when: device.model
    level: 2
    text: Test instrument
  - type: fields
    when: device.model
    rows:
      - [Type, "{{ device.manufacturer }} {{ device.model }}"]
      - [Serial number, "{{ device.serial_no }}"]
      - [Firmware, "{{ device.firmware }}"]
      - [Calibrated on, "{{ device.calibrated_on }}"]
      - [Recalibration due, "{{ device.recalibration_due }}"]
      - [Instrument clock, "{{ campaign.clock_summary }}"]
  - type: notice
    when: device.overdue
    text: "Recalibration of the test instrument was overdue at the time of testing ({{ device.recalibration_due }})."
  - type: steps
    blocks:
      - type: heading
        level: 2
        text: "{{ step.title }}"
      - type: measurements
        none:
          text: "Not measured.{% if step.note %} Reason: {{ step.note }}{% endif %}"
        one: {}
        many:
          summary: true
      - type: photos
  - type: heading
    when: places
    level: 2
    text: Notes and attachments
  - type: attachments
  - type: heading
    level: 2
    text: Result
  - type: text
    when: campaign.seal
    text: "Record seal: {{ campaign.seal }}"
  - type: signature
    result: "Test result: {{ verdict }}"
    labels: ["Place, date", "Signature {{ campaign.tester }}"]
