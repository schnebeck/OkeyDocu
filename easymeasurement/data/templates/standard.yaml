# EasyMeasurement - default template for test reports.
#
# A "measurements" block defines its look for each amount of data:
#   none: no measurement   one: exactly one   many: several
name: Standardprotokoll
blocks:
  - type: letterhead
    title: "Prüfprotokoll"
    lines:
      - "{{ campaign.title }}"
      - "{{ asset.kind_text }}: {{ asset.name }}"
      - "Prüfung vom {{ campaign.started }}"
    client:
      - "{{ customer.name }}"
      - "{{ customer.street }}"
      - "{{ customer.zip }} {{ customer.city }}"
    contractor:
      - "Prüfer: {{ campaign.tester }}"
    qr: true
  - type: fields
    rows:
      - ["{{ asset.kind_text }}", "{{ asset.name }}"]
      - [Kennung, "{{ asset.identifier }}"]
    features: asset
  - type: fields
    rows:
      - [Messplan, "{{ campaign.plan }}"]
      - [Beginn, "{{ campaign.started }}"]
      - [Abschluss, "{{ campaign.closed }}"]
  - type: heading
    when: device.model
    level: 2
    text: Messgerät
  - type: fields
    when: device.model
    rows:
      - [Typ, "{{ device.manufacturer }} {{ device.model }}"]
      - [Seriennummer, "{{ device.serial_no }}"]
      - [Firmware, "{{ device.firmware }}"]
      - [Kalibriert am, "{{ device.calibrated_on }}"]
      - [Rekalibrierung fällig, "{{ device.recalibration_due }}"]
      - [Geräteuhr, "{{ campaign.clock_summary }}"]
  - type: notice
    when: device.overdue
    text: "Die Rekalibrierung des Messgeräts war zum Prüfzeitpunkt überfällig ({{ device.recalibration_due }})."
  - type: steps
    blocks:
      - type: heading
        level: 2
        text: "{{ step.title }}"
      - type: measurements
        none:
          text: "Nicht gemessen.{% if step.note %} Begründung: {{ step.note }}{% endif %}"
        one: {}
        many:
          summary: true
      - type: photos
  - type: heading
    when: places
    level: 2
    text: Notizen und Anhänge
  - type: attachments
  - type: heading
    level: 2
    text: Ergebnis
  - type: text
    when: campaign.seal
    text: "Datensatz-Siegel: {{ campaign.seal }}"
  - type: signature
    result: "Ergebnis der Prüfung: {{ verdict }}"
    labels: ["Ort, Datum", "Unterschrift {{ campaign.tester }}"]
