# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: Durchgängigkeit Schutzleiter
function: rlo
selector: RLO
settings:
- Prüfstrom: 0,2 A
- Polarität: automatische Umpolung (±)
- Prüfdauer: AUTO
- Grenzwert: nach Leitungslänge und Querschnitt festlegen
warnings:
- Nur an spannungsfreien Teilen messen.
- Erst kontaktieren, dann starten. Wird zuerst gestartet und danach kontaktiert, löst die Gerätesicherung
  aus.
instructions:
- Sonde 3(PE) auf die PE-Schiene setzen.
- Sonde 1(L) auf den Messpunkt am Körper setzen.
- Am Gerät ON/START drücken.
- Wert mit „Save Value“ speichern. Langes Drücken speichert auf das zuletzt gewählte Objekt.
source: Bedienungsanleitung, Abschnitt 10.1.4 und 10.1.5
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Schutzleitersystem (spannungsfrei)
  terminals:
  - id: body
    label: Körper / Messpunkt
  - id: pe
    label: PE-Schiene
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: body
