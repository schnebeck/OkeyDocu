# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: Schleifenimpedanz L-PE
function: zloop
selector: ZLOOP AC/DC
settings:
- Nennstrom: nach Schutzorgan
- Auslösecharakteristik: nach Schutzorgan
- Berührungsspannung UL: 50 V
- Leiterbezug: L1-PE, L2-PE, L3-PE
warnings:
- Ein vorgeschaltetes RCD kann auslösen. Vorher Daten sichern und Verbraucher gegebenenfalls abschalten.
- An Drehstromanschlüssen alle drei Außenleiter gegen PE messen.
instructions:
- Sonde 3(PE) auf PE setzen.
- Sonde 1(L) auf den Außenleiter setzen.
- Am Gerät ON/START drücken.
- Werte bewerten und mit „Save Value“ speichern. Für jeden Außenleiter wiederholen.
source: Bedienungsanleitung, Abschnitt 13.1 und 13.2.3
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Stromkreis (unter Spannung)
  terminals:
  - id: l
    label: Außenleiter L1 / L2 / L3
  - id: pe
    label: PE
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: l
