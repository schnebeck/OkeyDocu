# EasyMeasurement - German texts: the structure tree, its elements and moving them.
texts:
  Remove empty elements: Leere Elemente entfernen
  Remove: Entfernen
  These elements and everything below them hold no measurement, no note and no file, in no campaign.: An diesen Elementen und allem darunter hängt keine Messung, keine Notiz und keine Datei, in keiner Kampagne.
  There are no empty elements here. Everything has measurements, notes or files.: Hier gibt es keine leeren Elemente. Alles hat Messungen, Notizen oder Dateien.
