# EasyMeasurement - German texts of the shipped measuring instructions and plans.
texts:
  "Protective conductor continuity": "Durchgängigkeit Schutzleiter"
  "Test current": "Prüfstrom"
  "0.2 A": "0,2 A"
  "Polarity": "Polarität"
  "automatic reversal (±)": "automatische Umpolung (±)"
  "Test duration": "Prüfdauer"
  "Limit": "Grenzwert"
  "set according to cable length and cross-section": "nach Leitungslänge und Querschnitt festlegen"
  "Measure only on de-energised parts.": "Nur an spannungsfreien Teilen messen."
  "Make contact first, then start. Starting first and making contact afterwards trips the instrument's fuse.": "Erst kontaktieren, dann starten. Wird zuerst gestartet und danach kontaktiert, löst die Gerätesicherung aus."
  "Place probe 3(PE) on the PE bar.": "Sonde 3(PE) auf die PE-Schiene setzen."
  "Place probe 1(L) on the measuring point on the enclosure.": "Sonde 1(L) auf den Messpunkt am Körper setzen."
  "Press ON/START on the instrument.": "Am Gerät ON/START drücken."
  "Save the value with “Save Value”. A long press saves it to the object chosen last.": "Wert mit „Save Value“ speichern. Langes Drücken speichert auf das zuletzt gewählte Objekt."
  "Operating instructions, sections 10.1.4 and 10.1.5": "Bedienungsanleitung, Abschnitt 10.1.4 und 10.1.5"
  "Protective conductor system (de-energised)": "Schutzleitersystem (spannungsfrei)"
  "Enclosure / measuring point": "Körper / Messpunkt"
  "PE bar": "PE-Schiene"
  "Insulation resistance": "Isolationswiderstand"
  "Test voltage": "Prüfspannung"
  "1.00 MΩ": "1,00 MΩ"
  "Conductor pair": "Leiterbezug"
  "L+N-PE: all live conductors together against PE; single pairs (L1-PE … L1-L3) to locate a fault": "L+N-PE: alle aktiven Leiter gemeinsam gegen PE; einzelne Paare (L1-PE … L1-L3), um einen Fehler einzugrenzen"
  "Measure only on de-energised parts of the installation.": "Nur an spannungsfreien Anlagenteilen messen."
  "Do not touch the test probes during the measurement.": "Prüfspitzen während der Messung nicht berühren."
  "Capacitive test objects are charged. Disconnect only once the voltage at the probes has fallen below 10 V.": "Kapazitive Prüflinge werden aufgeladen. Verbindung erst trennen, wenn die Spannung an den Sonden unter 10 V gefallen ist."
  "In installations without an RCD, N and PE must be separated.": "Bei Anlagen ohne RCD müssen N und PE getrennt sein."
  "First short-circuit the test probes. The instrument must show less than 1 kΩ.": "Vorab die Prüfspitzen kurzschließen. Das Gerät muss unter 1 kΩ anzeigen."
  "Place probe 3(PE) on PE.": "Sonde 3(PE) auf PE setzen."
  "For L+N-PE, bridge the live conductors, L and N; at a three-phase connection L1, L2, L3 and N.": "Für L+N-PE die aktiven Leiter brücken, L und N; am Drehstromanschluss L1, L2, L3 und N."
  "Place probe 1(L) on the live conductor or on the bridge.": "Sonde 1(L) auf den aktiven Leiter oder die Brücke setzen."
  "Press ON/START on the instrument and wait for a stable value.": "Am Gerät ON/START drücken und den stabilen Wert abwarten."
  "Save the value with “Save Value”.": "Wert mit „Save Value“ speichern."
  "Operating instructions, section 11.1.4": "Bedienungsanleitung, Abschnitt 11.1.4"
  "Circuit (de-energised)": "Stromkreis (spannungsfrei)"
  "Live conductor": "Aktiver Leiter"
  "Voltage and phase sequence": "Spannung und Drehfeld"
  "U (view U3~)": "U (Ansicht U3~)"
  "View": "Ansicht"
  "choose U3~ with the softkey": "U3~ per Softkey wählen"
  "The connection is crossed. L2 goes on probe 3(PE), L3 on probe 2(N).": "Die Belegung ist über Kreuz. L2 gehört auf Sonde 3(PE), L3 auf Sonde 2(N)."
  "Place probe 1(L) on L1.": "Sonde 1(L) auf L1 setzen."
  "Place probe 3(PE) on L2.": "Sonde 3(PE) auf L2 setzen."
  "Place probe 2(N) on L3.": "Sonde 2(N) auf L3 setzen."
  "The measurement runs without a start. Read the phase sequence and save it with “Save Value”.": "Die Messung läuft ohne Start. Drehfeld ablesen und mit „Save Value“ speichern."
  "Operating instructions, section 9.2.4": "Bedienungsanleitung, Abschnitt 9.2.4"
  "Three-phase connection": "Drehstromanschluss"
  "Loop impedance L-PE": "Schleifenimpedanz L-PE"
  "Rated current": "Nennstrom"
  "according to the protective device": "nach Schutzeinrichtung"
  "Tripping characteristic": "Auslösecharakteristik"
  "Touch voltage UL": "Berührungsspannung UL"
  "An upstream RCD may trip. Save data beforehand and switch off loads where necessary.": "Ein vorgeschaltetes RCD kann auslösen. Vorher Daten sichern und Verbraucher gegebenenfalls abschalten."
  "At three-phase connections, measure all three line conductors against PE.": "An Drehstromanschlüssen alle drei Außenleiter gegen PE messen."
  "Place probe 1(L) on the line conductor.": "Sonde 1(L) auf den Außenleiter setzen."
  "Assess the values and save them with “Save Value”. Repeat for each line conductor.": "Werte bewerten und mit „Save Value“ speichern. Für jeden Außenleiter wiederholen."
  "Operating instructions, sections 13.1 and 13.2.3": "Bedienungsanleitung, Abschnitt 13.1 und 13.2.3"
  "Circuit (live)": "Stromkreis (unter Spannung)"
  "Line conductor L1 / L2 / L3": "Außenleiter L1 / L2 / L3"
  "RCD – tripping test": "RCD – Auslöseprüfung"
  "Rated residual current IΔN": "Nennfehlerstrom IΔN"
  "according to the RCD": "nach RCD"
  "RCD type": "RCD-Typ"
  "The tripping test switches the circuit off. Secure loads beforehand.": "Die Auslöseprüfung schaltet den Stromkreis ab. Vorher Verbraucher sichern."
  "A test with smooth DC residual current also needs probe 2(N) on N.": "Prüfung mit Gleichfehlerstrom braucht zusätzlich Sonde 2(N) an N."
  "ON/START measures the touch voltage.": "ON/START misst die Berührungsspannung."
  "IΔN starts the tripping test.": "IΔN startet die Auslöseprüfung."
  "Operating instructions, section 12.2.4": "Bedienungsanleitung, Abschnitt 12.2.4"
  "Circuit behind the RCD (live)": "Stromkreis hinter dem RCD (unter Spannung)"
  "Line conductor": "Außenleiter"
  "Machine – electrical inspection": "Maschine – elektrische Prüfung"
