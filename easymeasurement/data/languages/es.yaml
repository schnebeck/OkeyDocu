  bestanden: correcto
  nicht bestanden: no correcto
  nicht bewertet: sin evaluar
  Bestanden: Correcto
  Nicht bestanden: No correcto
  Nicht vollständig geprüft: Ensayo incompleto
  rechts: horario
  links: antihorario
