# EasyMeasurement - protocol texts in Spanish, looked up by their German original.
# A text missing here stays German in the protocol.
name: Español
formats:
  date: "%d/%m/%Y"
  decimal: ","
texts:
  # Templates
  Prüfprotokoll: Informe de ensayo
  Kunde: Cliente
  Anschrift: Dirección
  Kennung: Identificador
  Prüfung: Inspección
  Messplan: Plan de ensayo
  Prüfer: Inspector
  Beginn: Inicio
  Abschluss: Fin
  Messgerät: Instrumento de medida
  Typ: Tipo
  Gerät: Aparato
  Anlage: Instalación
  Seriennummer: Número de serie
  Firmware: Firmware
  Kalibriert am: Calibrado el
  Rekalibrierung fällig: Próxima calibración
  Geräteuhr: Reloj del instrumento
  "Die Rekalibrierung des Messgeräts war zum Prüfzeitpunkt überfällig ({{ device.recalibration_due }}).": "La calibración del instrumento estaba vencida en el momento del ensayo ({{ device.recalibration_due }})."
  "Nicht gemessen.{% if step.note %} Begründung: {{ step.note }}{% endif %}": "No medido.{% if step.note %} Motivo: {{ step.note }}{% endif %}"
  Notizen und Anhänge: Notas y anexos
  Ergebnis: Resultado
  "Ergebnis der Messwerte: {{ verdict }}": "Resultado de las mediciones: {{ verdict }}"
