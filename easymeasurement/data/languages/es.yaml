  Maschine: Máquina
  Verteiler: Cuadro de distribución
  RCD: Diferencial
  Stromkreis: Circuito
  Betriebsmittel: Equipo
  Messpunkt: Punto de medida
  # Functions
  U – Spannung: U – Tensión
  U3~ – Drehfeld: U3~ – Secuencia de fases
  RLO – Schutzleiterwiderstand: RLO – Resistencia del conductor de protección
  RLO-25A – Schutzleiterwiderstand 25 A: RLO-25A – Resistencia del conductor de protección 25 A
  RISO – Isolationswiderstand: RISO – Resistencia de aislamiento
  RISO-Rampe – Isolationswiderstand: Rampa RISO – Resistencia de aislamiento
  IL – Ableitstrom: IL – Corriente de fuga
  I_ZANGE – Zangenstrom: I_PINZA – Corriente con pinza
  URES – Restspannung: URES – Tensión residual
  IMD – Isolationsüberwachung: IMD – Vigilancia de aislamiento
  RCD UIΔN – Berührungsspannung: Diferencial UIΔN – Tensión de contacto
  RCD IΔN – Auslösezeit: Diferencial IΔN – Tiempo de disparo
  RCD IF-UIΔN – Berührungsspannung bei Rampe: Diferencial IF-UIΔN – Tensión de contacto con rampa
  RCD IF – Auslösestrom: Diferencial IF – Corriente de disparo
  I_RAMP – Stromrampe: I_RAMP – Rampa de corriente
  RCM UIΔN – Berührungsspannung: RCM UIΔN – Tensión de contacto
  ZLOOP – Schleifenimpedanz: ZLOOP – Impedancia de bucle
  ZLOOP+DC – Schleifenimpedanz: ZLOOP+DC – Impedancia de bucle
  ZLOOP+RLO – Schleifenimpedanz: ZLOOP+RLO – Impedancia de bucle
  ZLOOP+0,5x – Schleifenimpedanz: ZLOOP+0,5x – Impedancia de bucle
  ZLN-ΔU – Netzimpedanz und Spannungsfall: ZLN-ΔU – Impedancia de red y caída de tensión
  Sichtprüfung: Inspección visual
  Sonstige Messung: Otra medición
  Unlesbarer Gerätedatensatz: Registro del instrumento ilegible
  # Steps of the shipped plans
  Spannung und Drehfeld: Tensión y secuencia de fases
  Isolationswiderstand: Resistencia de aislamiento
  Durchgängigkeit Schutzleiter: Continuidad de los conductores de protección
  RCD – Auslöseprüfung: Diferencial – Prueba de disparo
  Schleifenimpedanz L-PE: Impedancia de bucle L-PE
  # Clock
  "am {moment} gestellt (Abweichung vorher {offset} s)": "ajustado el {moment} (desviación previa {offset} s)"
  "Versatz am {moment} von Hand auf {offset} s festgelegt": "desfase fijado a mano en {offset} s el {moment}"
  "Versatz {offset} s, die Zeiten unten sind korrigiert": "desfase {offset} s, las horas abajo están corregidas"
  Abweichung 0 s: desviación 0 s
  # Notices and page
  "ENTWURF – die Kampagne ist noch offen, dieses Protokoll ist nicht gültig.": "BORRADOR – la inspección sigue abierta, este informe no es válido."
  "SIMULIERTE MESSWERTE – kein gültiges Prüfprotokoll.": "VALORES SIMULADOS – no es un informe de ensayo válido."
  "ENTWURF – nicht gültig": "BORRADOR – no válido"
  "Seite {page} von {total}": "Página {page} de {total}"
  Vorschau mit Beispieldaten: Vista previa con datos de ejemplo
