# EasyMeasurement - protocol texts in English, looked up by their German original.
# A text missing here stays German in the protocol.
name: English
formats:
  date: "%Y-%m-%d"
  decimal: "."
texts:
  # Templates
  Prüfprotokoll: Test report
  Kunde: Customer
  Anschrift: Address
  Kennung: Identifier
  Prüfung: Inspection
  Messplan: Test plan
  Prüfer: Inspector
  Beginn: Started
  Abschluss: Completed
  Messgerät: Test instrument
  Typ: Type
  Gerät: Device
  Anlage: Installation
  Seriennummer: Serial number
  Firmware: Firmware
  Kalibriert am: Calibrated on
  Rekalibrierung fällig: Recalibration due
  Geräteuhr: Instrument clock
  "Die Rekalibrierung des Messgeräts war zum Prüfzeitpunkt überfällig ({{ device.recalibration_due }}).": "Recalibration of the test instrument was overdue at the time of testing ({{ device.recalibration_due }})."
  "Nicht gemessen.{% if step.note %} Begründung: {{ step.note }}{% endif %}": "Not measured.{% if step.note %} Reason: {{ step.note }}{% endif %}"
  Notizen und Anhänge: Notes and attachments
  Ergebnis: Result
  "Ergebnis der Messwerte: {{ verdict }}": "Result of the measurements: {{ verdict }}"
  "Datensatz-Siegel: {{ campaign.seal }}": "Record seal: {{ campaign.seal }}"
  Auftraggeber: Client
  Auftragnehmer: Contractor
  "Prüfung vom {{ campaign.started }}": "Tested on {{ campaign.started }}"
  "Prüfer: {{ campaign.tester }}": "Inspector: {{ campaign.tester }}"
  "Ergebnis der Prüfung: {{ verdict }}": "Test result: {{ verdict }}"
  "Unterschrift {{ campaign.tester }}": "Signature {{ campaign.tester }}"
  Fortsetzung: continued
  Prüffrage: Question
  Antwort: Answer
  Bemerkung: Remark
  Hersteller: Manufacturer
  "Ansprechpartner: {{ campaign.contact }}": "Contact: {{ campaign.contact }}"
  "Telefon: {{ campaign.contact_phone }}": "Phone: {{ campaign.contact_phone }}"
  "Abteilung: {{ campaign.department }}": "Department: {{ campaign.department }}"
  "Kostenstelle: {{ campaign.cost_center }}": "Cost centre: {{ campaign.cost_center }}"
  Ort, Datum: Place, date
  Unterschrift Prüfer: Signature of inspector
  Keine Messung.: No measurement.
  # Verdicts and outcomes
  bestanden: passed
  nicht bestanden: failed
  nicht bewertet: not evaluated
  Bestanden: Passed
  Nicht bestanden: Failed
  Nicht vollständig geprüft: Not completely tested
  rechts: clockwise
  links: anticlockwise
  Fehler: error
  ja: "yes"
  nein: "no"
  # Measurements
  Zeitpunkt: Time
  Leiter: Conductors
  Messort im Gerät: Location in the equipment
  Messort: Location
  Grenzwert: limit
  Soll: expected
  Fotos: Photos
  Mangel: Defect
  Hinweis: Note
  Dokumentation: Documentation
  Bewertung: Verdict
  Kommentar: Comment
  Notiz: Note
  Anhang: Attachment
  Nr.: No.
  Min: Min
  Max: Max
  manuell: manual
  geändert: changed
  Prüfung allgemein: Inspection in general
  # Kinds of installation parts
  Maschine: Machine
  Verteiler: Distribution board
  RCD: RCD
  Stromkreis: Circuit
  Betriebsmittel: Equipment
  Messpunkt: Measuring point
  # Functions
  U – Spannung: U – Voltage
  U3~ – Drehfeld: U3~ – Phase sequence
  RLO – Schutzleiterwiderstand: RLO – Protective conductor resistance
  RLO-25A – Schutzleiterwiderstand 25 A: RLO-25A – Protective conductor resistance 25 A
  RISO – Isolationswiderstand: RISO – Insulation resistance
  RISO-Rampe – Isolationswiderstand: RISO ramp – Insulation resistance
  IL – Ableitstrom: IL – Leakage current
  I_ZANGE – Zangenstrom: I_CLAMP – Clamp current
  URES – Restspannung: URES – Residual voltage
  IMD – Isolationsüberwachung: IMD – Insulation monitoring
  RCD UIΔN – Berührungsspannung: RCD UIΔN – Touch voltage
  RCD IΔN – Auslösezeit: RCD IΔN – Tripping time
  RCD IF-UIΔN – Berührungsspannung bei Rampe: RCD IF-UIΔN – Touch voltage with ramp
  RCD IF – Auslösestrom: RCD IF – Tripping current
  I_RAMP – Stromrampe: I_RAMP – Current ramp
  RCM UIΔN – Berührungsspannung: RCM UIΔN – Touch voltage
  ZLOOP – Schleifenimpedanz: ZLOOP – Loop impedance
  ZLOOP+DC – Schleifenimpedanz: ZLOOP+DC – Loop impedance
  ZLOOP+RLO – Schleifenimpedanz: ZLOOP+RLO – Loop impedance
  ZLOOP+0,5x – Schleifenimpedanz: ZLOOP+0.5x – Loop impedance
  ZLN-ΔU – Netzimpedanz und Spannungsfall: ZLN-ΔU – Line impedance and voltage drop
  Sichtprüfung: Visual inspection
  Sonstige Messung: Other measurement
  Unlesbarer Gerätedatensatz: Unreadable instrument record
  # Steps of the shipped plans
  Spannung und Drehfeld: Voltage and phase sequence
  Isolationswiderstand: Insulation resistance
  Durchgängigkeit Schutzleiter: Continuity of protective conductors
  RCD – Auslöseprüfung: RCD – Tripping test
  Schleifenimpedanz L-PE: Loop impedance L-PE
  # Clock
  "am {moment} gestellt (Abweichung vorher {offset} s)": "set on {moment} (deviation before {offset} s)"
  "Versatz am {moment} von Hand auf {offset} s festgelegt": "offset set by hand to {offset} s on {moment}"
  "Versatz {offset} s, die Zeiten unten sind korrigiert": "offset {offset} s, the times below are corrected"
  Abweichung 0 s: deviation 0 s
  # Notices and page
  "ENTWURF – die Kampagne ist noch offen, dieses Protokoll ist nicht gültig.": "DRAFT – the inspection is still open, this report is not valid."
  "SIMULIERTE MESSWERTE – kein gültiges Prüfprotokoll.": "SIMULATED VALUES – not a valid test report."
  "ENTWURF – nicht gültig": "DRAFT – not valid"
  "Seite {page} von {total}": "Page {page} of {total}"
  Vorschau mit Beispieldaten: Preview with sample data
