  i_f: {symbol: I_Δ, quantity: current, name: Tripping current}
  ik: {symbol: I_K, quantity: current, name: Prospective short-circuit current}
  ta: {symbol: t_a, quantity: time, name: Tripping time}
  zlpe: {symbol: Z_L-PE, quantity: impedance, name: Loop impedance L-PE}
  zln: {symbol: Z_L-N, quantity: impedance, name: Line impedance L-N}
  zloop: {symbol: Z_AC, quantity: impedance, name: Loop impedance}
