  impedance: {unit: Ω, name: Impedance}
  voltage: {unit: V, name: Voltage}
  current: {unit: A, name: Current}
  frequency: {unit: Hz, name: Frequency}
  time: {unit: s, name: Duration}
  direction: {unit: "", name: Direction}

results:
