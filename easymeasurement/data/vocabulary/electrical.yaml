  u_delta: {symbol: ΔU, quantity: voltage, name: Voltage drop}
  u_iso: {symbol: U_ISO, quantity: voltage, name: Test voltage}
  u_idn: {symbol: U_IΔN, quantity: voltage, name: Touch voltage}
  ue: {symbol: U_E, quantity: voltage, name: Voltage UE}
  f: {symbol: f, quantity: frequency, name: Frequency}
  rotation: {symbol: Rotating field, quantity: direction, name: Phase sequence}
  rlo: {symbol: R_LO, quantity: resistance, name: Protective conductor resistance}
  rlo_plus: {symbol: R_LO+, quantity: resistance, name: "Protective conductor resistance, positive"}
  rlo_minus: {symbol: R_LO−, quantity: resistance, name: "Protective conductor resistance, negative"}
  rlo_delta: {symbol: ΔR_LO, quantity: resistance, name: Difference of the polarities}
  rlo_offset: {symbol: "R_LO,offset", quantity: resistance, name: Lead compensation}
  riso: {symbol: R_ISO, quantity: resistance, name: Insulation resistance}
  re: {symbol: R_E, quantity: resistance, name: Earth resistance}
  il: {symbol: I_L, quantity: current, name: Leakage current}
