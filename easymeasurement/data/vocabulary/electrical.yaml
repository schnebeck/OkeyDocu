# EasyMeasurement - vocabulary of electrical safety testing.
# Keys are stored with every measurement and never change; symbols and names are English
# and translated by the language catalogues (data/languages/<code>/vocabulary_*.yaml).
#
# quantities: what is measured, with its unit (base unit for prefixes such as mΩ)
# results:    one figure a function produces: symbol, quantity, name
# functions:  a measuring function as the inspector chooses it: symbol, name and,
#             optionally, the results it produces
# outcomes:   neutral words of checks without a number
# settings:   known settings of a function
#
# Producer: thorsten.schnebeck@gmx.net
# Generator: Claude Opus 5.5
# SPDX-FileCopyrightText: (C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>
# SPDX-License-Identifier: GPL-3.0-or-later

