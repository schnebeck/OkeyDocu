                Charakteristik, Querschnitt|mm², Ex-Nummer, Ex-Zone, Zündschutzart,
                Leitungslänge|m]}
  - {key: device, label: Gerät, icon: device, device: ELECTRICALEQUIPMENT, interval: 12,
