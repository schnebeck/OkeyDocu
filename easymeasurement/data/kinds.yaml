# EasyMeasurement - easymeasurement/data/kinds.yaml
# The kinds of structure elements a new database starts with. All of it can be changed
# under Einstellungen → Strukturtypen.
#
# device:   what the element is on the PROFITEST PRIME (MACHINE, DISTRIBUTIONCABINET, RCD,
#           CIRCUIT, ELECTRICALEQUIPMENT, MEASURINGPOINT), empty if it has no counterpart
# izytron:  object type code in an IZYTRON.IQ database, for the import
# interval: months until the next inspection is due, 0 for none
# features: "Bezeichnung|Einheit"; features left empty are not shown anywhere
#
# Producer: thorsten.schnebeck@gmx.net
# Generator: Claude Opus 5.5
# SPDX-FileCopyrightText: (C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>
# SPDX-License-Identifier: GPL-3.0-or-later

kinds:
  - {key: installation, label: Anlage, icon: installation, device: MACHINE, interval: 48,
     features: [Betreiber, Anlagenverantwortlicher, Errichter, Errichtungsjahr, Netzbetreiber,
                Netzform, Netzspannung|V, Netzfrequenz|Hz, Nennstrom|A, Leitungstyp,
                Querschnitt|mm², Leitungslänge|m]}
  - {key: machine, label: Maschine, icon: machine, device: MACHINE, izytron: 231, interval: 12,
     features: [CE-Kennzeichnung, Schutzart IP, Schutzklasse, Nennspannung|V, Netzform,
