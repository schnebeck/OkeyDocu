# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: Voltage and phase sequence
function: u3
selector: U (view U3~)
settings:
- View: choose U3~ with the softkey
warnings:
- The connection is crossed. L2 goes on probe 3(PE), L3 on probe 2(N).
instructions:
- Place probe 1(L) on L1.
- Place probe 3(PE) on L2.
- Place probe 2(N) on L3.
- The measurement runs without a start. Read the phase sequence and save it with “Save Value”.
source: Operating instructions, section 9.2.4
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Three-phase connection
  terminals:
  - id: l1
    label: L1
  - id: l2
    label: L2
  - id: l3
    label: L3
  wires:
  - socket: 1(L)
    target: l1
  - socket: 3(PE)
    target: l2
  - socket: 2(N)
    target: l3
