# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: Insulation resistance
function: riso
selector: RISO
settings:
- Test voltage: 500 V
- Limit: 1.00 MΩ
- Test duration: AUTO
- Conductor pair: choose to suit the measuring point (L1-PE … L1-L3)
warnings:
- Measure only on de-energised parts of the installation.
- Do not touch the test probes during the measurement.
- Capacitive test objects are charged. Disconnect only once the voltage at the probes has fallen below
  10 V.
- In installations without an RCD, N and PE must be separated.
instructions:
- First short-circuit the test probes. The instrument must show less than 1 kΩ.
- Place probe 3(PE) on PE.
- Place probe 1(L) on the live conductor.
- Press ON/START on the instrument and wait for a stable value.
- Save the value with “Save Value”.
source: Operating instructions, section 11.1.4
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Circuit (de-energised)
  terminals:
  - id: l
    label: Live conductor
  - id: pe
    label: PE
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: l
