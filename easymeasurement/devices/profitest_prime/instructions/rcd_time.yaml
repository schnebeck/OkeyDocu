# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: RCD – tripping test
function: rcd_time
also_accepts:
- rcd_touch
- rcd_current
selector: IΔN
element_settings:
- rated_residual_current
- rcd_type
- rated_current
settings:
- Touch voltage UL: 50 V
warnings:
- The tripping test switches the circuit off. Secure loads beforehand.
- A test with smooth DC residual current also needs probe 2(N) on N.
instructions:
- Place probe 3(PE) on PE.
- Place probe 1(L) on the line conductor.
- ON/START measures the touch voltage.
- IΔN starts the tripping test.
- Save the value with “Save Value”.
source: Operating instructions, section 12.2.4
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Circuit behind the RCD (live)
  terminals:
  - id: l
    label: Line conductor
  - id: pe
    label: PE
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: l
