# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: RCD – Auslöseprüfung
function: rcd_time
also_accepts:
- rcd_touch
- rcd_current
selector: IΔN
settings:
- Nennfehlerstrom IΔN: nach RCD
- RCD-Typ: nach RCD
- Berührungsspannung UL: 50 V
warnings:
- Die Auslöseprüfung schaltet den Stromkreis ab. Vorher Verbraucher sichern.
- Prüfung mit Gleichfehlerstrom braucht zusätzlich Sonde 2(N) an N.
instructions:
- Sonde 3(PE) auf PE setzen.
- Sonde 1(L) auf den Außenleiter setzen.
- ON/START misst die Berührungsspannung.
- IΔN startet die Auslöseprüfung.
- Wert mit „Save Value“ speichern.
source: Bedienungsanleitung, Abschnitt 12.2.4
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Stromkreis hinter dem RCD (unter Spannung)
  terminals:
  - id: l
    label: Außenleiter
  - id: pe
    label: PE
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: l
