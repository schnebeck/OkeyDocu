# EasyMeasurement - instruction for one measuring function, draft.
# Connections follow the PROFITEST PRIME manual (3-349-933-03).
# `dut` says how the test object has to be operated during the measurement.
title: Loop impedance L-PE
function: zloop
selector: ZLOOP AC/DC
settings:
- Rated current: according to the protective device
- Tripping characteristic: according to the protective device
- Touch voltage UL: 50 V
- Conductor pair: L1-PE, L2-PE, L3-PE
warnings:
- An upstream RCD may trip. Save data beforehand and switch off loads where necessary.
- At three-phase connections, measure all three line conductors against PE.
instructions:
- Place probe 3(PE) on PE.
- Place probe 1(L) on the line conductor.
- Press ON/START on the instrument.
- Assess the values and save them with “Save Value”. Repeat for each line conductor.
source: Operating instructions, sections 13.1 and 13.2.3
wiring:
  instrument: PROFITEST PRIME
  sockets:
  - 1(L)
  - 2(N)
  - 3(PE)
  object_label: Circuit (live)
  terminals:
  - id: l
    label: Line conductor L1 / L2 / L3
  - id: pe
    label: PE
  wires:
  - socket: 3(PE)
    target: pe
  - socket: 1(L)
    target: l
